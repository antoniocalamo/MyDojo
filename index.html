<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>My Dojo</title>
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-2: #f4f6fa;
    --border: #e3e7ee;
    --text: #14161a;
    --text-dim: #6b7280;
    --accent: #2f6fed;
    --accent-ink: #ffffff;
    --cta: #7cc61a;
    --cta-ink: #16210a;
    --danger: #e5484d;
    --danger-bg: rgba(229,72,77,0.1);
    --ok: #16a34a;
    --radius-lg: 22px;
    --radius: 16px;
    --radius-sm: 12px;
  }
  html[data-theme="verde"] {
    --accent: #1a9c5e;
    --cta: #f5a623;
    --cta-ink: #241500;
  }
  html[data-theme="scuro"] {
    --bg: #0f1115;
    --surface: #1a1d24;
    --surface-2: #22262f;
    --border: #2c3038;
    --text: #f2f3f5;
    --text-dim: #9aa0ac;
    --accent: #5b93ff;
    --cta: #a3e635;
    --cta-ink: #16210a;
    --danger-bg: rgba(229,72,77,0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: 90px;
  }
  main.screen { padding: 20px 18px 24px; }
  h1.page-title {
    font-size: 28px;
    font-weight: 800;
    margin: 6px 0 4px;
    letter-spacing: -0.02em;
  }
  p.page-sub { color: var(--text-dim); margin: 0 0 20px; font-size: 14px; }

  .back-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 999px;
    font-size: 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 999px;
    padding: 15px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-cta { background: var(--cta); color: var(--cta-ink); }
  .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-small { width: auto; padding: 10px 16px; font-size: 13px; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .btn { width: auto; flex: 1; }
  .btn[disabled] { opacity: 0.5; cursor: default; }

  input, textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 12px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 5px; font-weight: 600; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-bottom: 14px;
  }

  .hero-card {
    border-radius: var(--radius-lg);
    padding: 22px;
    margin-bottom: 16px;
    color: #fff;
    position: relative;
    overflow: hidden;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    cursor: pointer;
  }
  .hero-card .hero-icon {
    position: absolute;
    right: -10px;
    top: -10px;
    font-size: 90px;
    opacity: 0.18;
    line-height: 1;
  }
  .hero-card .hero-title { font-size: 19px; font-weight: 800; margin: 0; text-shadow: 0 1px 6px rgba(0,0,0,0.25); }
  .hero-card .hero-meta { font-size: 13px; opacity: 0.92; margin: 2px 0 0; }
  .hero-card.live { box-shadow: 0 0 0 3px var(--cta); }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.25);
    color: #fff;
    backdrop-filter: blur(2px);
  }
  .tag-solid { background: var(--cta); color: var(--cta-ink); }

  .stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .stat-tile {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
  }
  .stat-tile .num { font-size: 22px; font-weight: 800; display: block; }
  .stat-tile .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }

  .empty { text-align: center; color: var(--text-dim); padding: 40px 16px; font-size: 14px; }
  .error-msg, .info-msg {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin-bottom: 12px;
  }
  .error-msg { background: var(--danger-bg); color: var(--danger); }
  .info-msg { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }

  .exercise-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    margin-bottom: 8px;
  }
  .exercise-row .name { font-size: 15px; font-weight: 600; }
  .exercise-row button {
    background: transparent;
    border: none;
    color: var(--danger);
    font-size: 20px;
    cursor: pointer;
    padding: 2px 8px;
    line-height: 1;
  }

  .set-list { list-style: none; margin: 10px 0; padding: 0; }
  .set-list li {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .set-list li .num { color: var(--text-dim); }
  .set-list li .val { font-weight: 700; }

  .set-form { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .set-form .field { flex: 1; }
  .set-form input { margin-bottom: 0; }
  .set-form button { width: auto; padding: 13px 16px; }

  .link-btn { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; }

  form.inline-add { display: flex; gap: 8px; margin-top: 12px; }
  form.inline-add input { margin-bottom: 0; }
  form.inline-add button { width: auto; padding: 13px 18px; }

  /* bottom nav */
  nav.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  nav.bottom-nav button {
    flex: 1;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 0;
    border-radius: var(--radius-sm);
  }
  nav.bottom-nav button svg { width: 22px; height: 22px; }
  nav.bottom-nav button.active { color: var(--accent); background: var(--surface-2); }

  /* fixed bottom CTA (workout screen) */
  .fixed-cta {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    z-index: 20;
  }

  /* profile */
  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 800;
    margin: 8px auto 12px;
  }
  .profile-header { text-align: center; margin-bottom: 22px; }
  .profile-header .email { color: var(--text-dim); font-size: 14px; }

  .theme-row { display: flex; gap: 10px; margin-top: 8px; }
  .theme-swatch {
    flex: 1;
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
  }
  .theme-swatch.selected { border-color: var(--accent); }
  .theme-swatch .dot { width: 20px; height: 20px; border-radius: 999px; margin: 0 auto 8px; }

  h3.section-title { font-size: 15px; font-weight: 800; margin: 22px 0 10px; }
</style>
</head>
<body>
<div id="app"><div class="empty">Caricamento...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://ctfedjwikdgcfqzyzzdn.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0ZmVkandpa2RnY2Zxenl6emRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDk4ODQsImV4cCI6MjEwMjM4NTg4NH0.DHByCjnaddzArYURy8feSfrxo8glx7bs1bTbeYBhEyA";

  var THEMES = ["blu", "verde", "scuro"];
  var THEME_LABELS = { blu: "Blu", verde: "Verde", scuro: "Scuro" };
  var THEME_DOT_COLOR = { blu: "#2f6fed", verde: "#1a9c5e", scuro: "#0f1115" };

  var GRADIENTS = [
    "linear-gradient(135deg,#667eea,#764ba2)",
    "linear-gradient(135deg,#11998e,#38ef7d)",
    "linear-gradient(135deg,#ee0979,#ff6a00)",
    "linear-gradient(135deg,#2b5876,#4e4376)",
    "linear-gradient(135deg,#ff512f,#dd2476)",
    "linear-gradient(135deg,#1488cc,#2b32b2)"
  ];

  var NAV_ICONS = {
    schede: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><line x1="8" y1="8" x2="16" y2="8"></line><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="12" y2="16"></line></svg>',
    storico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="12"></line><line x1="12" y1="20" x2="12" y2="6"></line><line x1="19" y1="20" x2="19" y2="15"></line></svg>',
    profilo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>'
  };

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var state = {
    user: null,
    view: "loading",
    authMode: "login",
    authError: "",
    theme: "blu",
    templates: [],
    currentTemplate: null,
    currentTemplateExercises: [],
    activeSession: null,
    sessionExercises: [],
    sessionSets: [],
    history: [],
    historyDetail: null,
    historyDetailSets: [],
    stats: { count: 0, hours: 0 },
    busy: false
  };

  try {
    var savedTheme = localStorage.getItem("mydojo-theme");
    if (savedTheme && THEMES.indexOf(savedTheme) !== -1) state.theme = savedTheme;
  } catch (e) {}
  document.documentElement.setAttribute("data-theme", state.theme);

  var app = document.getElementById("app");
  var workoutTimerHandle = null;

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    return d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }) +
      " " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  }

  function gradientFor(id) {
    var sum = 0;
    String(id).split("").forEach(function (c) { sum += c.charCodeAt(0); });
    return GRADIENTS[sum % GRADIENTS.length];
  }

  function elapsedText(startedAt) {
    var secs = Math.max(0, Math.floor((Date.now() - new Date(startedAt).getTime()) / 1000));
    var h = Math.floor(secs / 3600);
    var m = Math.floor((secs % 3600) / 60);
    var s = secs % 60;
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    return (h > 0 ? h + ":" + pad(m) : m) + ":" + pad(s);
  }

  function stopWorkoutTimer() {
    if (workoutTimerHandle) { clearInterval(workoutTimerHandle); workoutTimerHandle = null; }
  }

  function startWorkoutTimer(startedAt) {
    stopWorkoutTimer();
    workoutTimerHandle = setInterval(function () {
      var el = document.getElementById("workout-elapsed");
      if (!el) { stopWorkoutTimer(); return; }
      el.textContent = elapsedText(startedAt);
    }, 1000);
  }

  // ---------- render ----------

  function render() {
    if (state.view !== "workout") stopWorkoutTimer();

    if (state.view === "loading") {
      app.innerHTML = '<div class="empty">Caricamento...</div>';
      return;
    }
    if (!state.user) {
      app.innerHTML = renderAuth();
      return;
    }

    var tabs = ["home", "history", "profile"];
    var showNav = tabs.indexOf(state.view) !== -1;
    var body = "";
    if (state.view === "home") body = renderHome();
    else if (state.view === "template") body = renderTemplateEditor();
    else if (state.view === "workout") body = renderWorkout();
    else if (state.view === "history") body = renderHistory();
    else if (state.view === "historyDetail") body = renderHistoryDetail();
    else if (state.view === "profile") body = renderProfile();
    else body = renderHome();

    app.innerHTML =
      '<main class="screen">' + body + '</main>' +
      (showNav ? renderBottomNav() : "");

    if (state.view === "workout" && state.activeSession) {
      startWorkoutTimer(state.activeSession.started_at);
    }
  }

  function renderBottomNav() {
    function item(view, key, label) {
      return '<button class="' + (state.view === view ? "active" : "") + '" data-action="nav" data-view="' + view + '">' +
        NAV_ICONS[key] + '<span>' + label + '</span></button>';
    }
    return '<nav class="bottom-nav">' +
      item("home", "schede", "Schede") +
      item("history", "storico", "Storico") +
      item("profile", "profilo", "Profilo") +
      '</nav>';
  }

  function renderAuth() {
    var isLogin = state.authMode === "login";
    return '' +
      '<main class="screen" style="padding-top:70px;">' +
        '<h1 style="text-align:center;font-size:32px;font-weight:800;margin-bottom:4px;">My Dojo</h1>' +
        '<p style="text-align:center;color:var(--text-dim);margin-top:0;margin-bottom:28px;">Le tue schede, i tuoi progressi.</p>' +
        (state.authError ? '<div class="error-msg">' + escapeHtml(state.authError) + '</div>' : '') +
        '<form data-action="submit-auth">' +
          '<label>Email</label>' +
          '<input type="email" name="email" required autocomplete="email">' +
          '<label>Password</label>' +
          '<input type="password" name="password" required autocomplete="' + (isLogin ? "current-password" : "new-password") + '" minlength="6">' +
          '<button class="btn btn-accent" type="submit" ' + (state.busy ? "disabled" : "") + '>' +
            (isLogin ? "Entra" : "Crea account") +
          '</button>' +
        '</form>' +
        (isLogin ? "" :
          '<p style="text-align:center;color:var(--text-dim);font-size:13px;margin-top:10px;">' +
            'Dopo la registrazione riceverai una email da <strong>Supabase</strong> (il servizio che gestisce gli account di questa app) per confermare il tuo indirizzo — è normale, non è spam.' +
          '</p>'
        ) +
        '<p style="text-align:center;margin-top:16px;">' +
          (isLogin ? "Non hai un account? " : "Hai già un account? ") +
          '<button class="link-btn" data-action="toggle-auth-mode">' + (isLogin ? "Registrati" : "Accedi") + '</button>' +
        '</p>' +
      '</main>';
  }

  function renderHome() {
    var html = '<h1 class="page-title">Schede</h1><p class="page-sub">Le tue schede di allenamento</p>';

    if (state.activeSession) {
      html += '<div class="hero-card live" style="background:' + gradientFor(state.activeSession.template_id || state.activeSession.id) + ';" data-action="resume-session">' +
        '<span class="hero-icon">🏋️</span>' +
        '<span class="tag tag-solid" style="width:fit-content;margin-bottom:8px;">In corso</span>' +
        '<p class="hero-title">' + escapeHtml(state.activeSession.template_name) + '</p>' +
        '<p class="hero-meta">Iniziato il ' + formatDate(state.activeSession.started_at) + ' — tocca per riprendere</p>' +
      '</div>';
    }

    if (state.templates.length === 0) {
      html += '<div class="empty">Non hai ancora nessuna scheda.<br>Creane una per iniziare.</div>';
    } else {
      state.templates.forEach(function (t) {
        html += '<div class="hero-card" style="background:' + gradientFor(t.id) + ';min-height:110px;" data-action="open-template" data-id="' + t.id + '">' +
          '<span class="hero-icon">💪</span>' +
          '<p class="hero-title">' + escapeHtml(t.name) + '</p>' +
          '<p class="hero-meta">Creata il ' + formatDate(t.created_at) + '</p>' +
        '</div>' +
        '<div class="btn-row" style="margin-top:-6px;margin-bottom:16px;">' +
          '<button class="btn btn-cta btn-small" data-action="start-session" data-id="' + t.id + '" ' + (state.activeSession ? "disabled" : "") + '>Inizia allenamento</button>' +
          '<button class="btn btn-ghost btn-small" data-action="open-template" data-id="' + t.id + '">Modifica</button>' +
        '</div>';
      });
    }

    html += '<button class="btn btn-accent" data-action="new-template">+ Nuova scheda</button>';
    return html;
  }

  function renderTemplateEditor() {
    var t = state.currentTemplate;
    var html = '<button class="back-btn" data-action="go-home">←</button>';
    html += '<h1 class="page-title">' + (t.id ? "Modifica scheda" : "Nuova scheda") + '</h1>';

    if (state.authError) html += '<div class="error-msg">' + escapeHtml(state.authError) + '</div>';

    html += '<form data-action="save-template-name">' +
      '<label>Nome scheda</label>' +
      '<input type="text" name="name" value="' + escapeHtml(t.name || "") + '" placeholder="Es. Petto/Tricipiti" required>' +
      '<button class="btn btn-accent" type="submit">' + (t.id ? "Salva nome" : "Crea scheda") + '</button>' +
    '</form>';

    if (t.id) {
      html += '<h3 class="section-title">Esercizi</h3>';
      if (state.currentTemplateExercises.length === 0) {
        html += '<p class="page-sub" style="margin:0 0 8px;">Nessun esercizio ancora aggiunto.</p>';
      } else {
        state.currentTemplateExercises.forEach(function (ex) {
          html += '<div class="exercise-row">' +
            '<span class="name">' + escapeHtml(ex.name) + '</span>' +
            '<button data-action="delete-exercise" data-id="' + ex.id + '">&times;</button>' +
          '</div>';
        });
      }
      html += '<form class="inline-add" data-action="add-exercise">' +
        '<input type="text" name="exname" placeholder="Nome esercizio" required>' +
        '<button class="btn btn-accent" type="submit">+</button>' +
      '</form>';

      html += '<button class="btn btn-danger" data-action="delete-template" data-id="' + t.id + '" style="margin-top:24px;">Elimina scheda</button>';
    }

    return html;
  }

  function renderWorkout() {
    var s = state.activeSession;
    var html = '<button class="back-btn" data-action="go-home">←</button>';
    html += '<div class="hero-card" style="background:' + gradientFor(s.template_id || s.id) + ';min-height:100px;cursor:default;">' +
      '<span class="hero-icon">🏋️</span>' +
      '<p class="hero-title">' + escapeHtml(s.template_name) + '</p>' +
      '<p class="hero-meta">In corso da <span id="workout-elapsed">' + elapsedText(s.started_at) + '</span></p>' +
    '</div>';

    if (state.sessionExercises.length === 0) {
      html += '<div class="empty">Questa scheda non ha esercizi.<br>Aggiungili prima di allenarti.</div>';
    }

    state.sessionExercises.forEach(function (ex) {
      var sets = state.sessionSets.filter(function (st) { return st.template_exercise_id === ex.id; });
      html += '<div class="card">' +
        '<p style="font-size:16px;font-weight:700;margin:0 0 4px;">' + escapeHtml(ex.name) + '</p>';

      if (sets.length > 0) {
        html += '<ul class="set-list">';
        sets.forEach(function (st) {
          html += '<li><span class="num">Serie ' + st.set_number + '</span><span class="val">' + st.reps + ' rip. × ' + st.weight + ' kg</span></li>';
        });
        html += '</ul>';
      }

      html += '<form class="set-form" data-action="add-set" data-exercise-id="' + ex.id + '" data-exercise-name="' + escapeHtml(ex.name) + '">' +
        '<div class="field"><label>Ripetizioni</label><input type="number" name="reps" min="0" required></div>' +
        '<div class="field"><label>Peso (kg)</label><input type="number" name="weight" min="0" step="0.5" required></div>' +
        '<button class="btn btn-accent" type="submit">+</button>' +
      '</form>' +
      '</div>';
    });

    html += '<div style="height:70px;"></div>';
    html += '<div class="fixed-cta"><button class="btn btn-cta" data-action="finish-session">Termina allenamento</button></div>';
    return html;
  }

  function renderHistory() {
    var html = '<h1 class="page-title">Storico</h1><p class="page-sub">I tuoi allenamenti passati</p>';

    html += '<div class="stats-row">' +
      '<div class="stat-tile"><span class="num">' + state.stats.count + '</span><span class="lbl">Allenamenti</span></div>' +
      '<div class="stat-tile"><span class="num">' + state.stats.hours + '</span><span class="lbl">Ore totali</span></div>' +
    '</div>';

    if (state.history.length === 0) {
      html += '<div class="empty">Nessun allenamento registrato ancora.</div>';
    } else {
      state.history.forEach(function (s) {
        html += '<div class="card" style="cursor:pointer;display:flex;align-items:center;gap:12px;" data-action="open-history-detail" data-id="' + s.id + '">' +
          '<div style="width:44px;height:44px;border-radius:12px;flex-shrink:0;background:' + gradientFor(s.template_id || s.id) + ';"></div>' +
          '<div>' +
            '<p style="font-weight:700;margin:0 0 2px;">' + escapeHtml(s.template_name) + (s.finished_at ? "" : ' <span class="tag tag-solid" style="color:var(--cta-ink);">In corso</span>') + '</p>' +
            '<p style="color:var(--text-dim);font-size:13px;margin:0;">' + formatDate(s.started_at) + '</p>' +
          '</div>' +
        '</div>';
      });
    }
    return html;
  }

  function renderHistoryDetail() {
    var s = state.historyDetail;
    var html = '<button class="back-btn" data-action="open-history">←</button>';
    html += '<h1 class="page-title">' + escapeHtml(s.template_name) + '</h1>';
    html += '<p class="page-sub">' + formatDate(s.started_at) +
      (s.finished_at ? " — durata " + durationText(s.started_at, s.finished_at) : " — in corso") + '</p>';

    var byExercise = {};
    var order = [];
    state.historyDetailSets.forEach(function (st) {
      if (!byExercise[st.exercise_name]) { byExercise[st.exercise_name] = []; order.push(st.exercise_name); }
      byExercise[st.exercise_name].push(st);
    });

    if (order.length === 0) {
      html += '<div class="empty">Nessuna serie registrata in questo allenamento.</div>';
    } else {
      order.forEach(function (name) {
        html += '<div class="card"><p style="font-weight:700;margin:0 0 4px;">' + escapeHtml(name) + '</p><ul class="set-list">';
        byExercise[name].forEach(function (st) {
          html += '<li><span class="num">Serie ' + st.set_number + '</span><span class="val">' + st.reps + ' rip. × ' + st.weight + ' kg</span></li>';
        });
        html += '</ul></div>';
      });
    }
    return html;
  }

  function renderProfile() {
    var email = state.user.email || "";
    var initial = email.charAt(0).toUpperCase() || "?";
    var html = '<div class="profile-header">' +
      '<div class="avatar">' + escapeHtml(initial) + '</div>' +
      '<div class="email">' + escapeHtml(email) + '</div>' +
    '</div>';

    html += '<div class="stats-row">' +
      '<div class="stat-tile"><span class="num">' + state.stats.count + '</span><span class="lbl">Allenamenti</span></div>' +
      '<div class="stat-tile"><span class="num">' + state.stats.hours + '</span><span class="lbl">Ore totali</span></div>' +
      '<div class="stat-tile"><span class="num">' + state.templates.length + '</span><span class="lbl">Schede</span></div>' +
    '</div>';

    html += '<h3 class="section-title">Aspetto</h3>';
    html += '<div class="theme-row">';
    THEMES.forEach(function (th) {
      html += '<div class="theme-swatch ' + (state.theme === th ? "selected" : "") + '" data-action="set-theme" data-theme="' + th + '">' +
        '<div class="dot" style="background:' + THEME_DOT_COLOR[th] + ';"></div>' + THEME_LABELS[th] +
      '</div>';
    });
    html += '</div>';

    html += '<button class="btn btn-ghost" data-action="logout" style="margin-top:28px;">Esci</button>';
    return html;
  }

  function durationText(start, end) {
    var mins = Math.max(0, Math.round((new Date(end) - new Date(start)) / 60000));
    if (mins < 60) return mins + " min";
    return Math.floor(mins / 60) + "h " + (mins % 60) + "min";
  }

  // ---------- data loading ----------

  function loadTemplates() {
    return sb.from("workout_templates").select("*").order("created_at", { ascending: false })
      .then(function (res) {
        if (res.error) throw res.error;
        state.templates = res.data;
      });
  }

  function loadActiveSession() {
    return sb.from("workout_sessions").select("*").is("finished_at", null)
      .order("started_at", { ascending: false }).limit(1)
      .then(function (res) {
        if (res.error) throw res.error;
        state.activeSession = res.data && res.data.length ? res.data[0] : null;
      });
  }

  function loadTemplateExercises(templateId) {
    return sb.from("template_exercises").select("*").eq("template_id", templateId).order("order_index", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        state.currentTemplateExercises = res.data;
      });
  }

  function loadSessionData(sessionId, templateId) {
    var p1 = templateId
      ? sb.from("template_exercises").select("*").eq("template_id", templateId).order("order_index", { ascending: true })
      : Promise.resolve({ data: [] });
    var p2 = sb.from("session_sets").select("*").eq("session_id", sessionId).order("created_at", { ascending: true });
    return Promise.all([p1, p2]).then(function (results) {
      if (results[0].error) throw results[0].error;
      if (results[1].error) throw results[1].error;
      state.sessionExercises = results[0].data;
      state.sessionSets = results[1].data;
    });
  }

  function loadHistory() {
    return sb.from("workout_sessions").select("*").order("started_at", { ascending: false })
      .then(function (res) {
        if (res.error) throw res.error;
        state.history = res.data;
        var count = res.data.length;
        var totalMs = 0;
        res.data.forEach(function (s) {
          if (s.finished_at) totalMs += new Date(s.finished_at) - new Date(s.started_at);
        });
        state.stats = { count: count, hours: Math.round((totalMs / 3600000) * 10) / 10 };
      });
  }

  function loadHistoryDetail(sessionId) {
    return sb.from("session_sets").select("*").eq("session_id", sessionId).order("created_at", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        state.historyDetailSets = res.data;
      });
  }

  // ---------- actions ----------

  function withBusy(fn) {
    if (state.busy) return;
    state.busy = true;
    return Promise.resolve().then(fn).catch(function (err) {
      state.authError = (err && err.message) || String(err);
    }).then(function () {
      state.busy = false;
      render();
    });
  }

  function goHome() {
    withBusy(function () {
      state.authError = "";
      return Promise.all([loadTemplates(), loadActiveSession(), loadHistory()]).then(function () {
        state.view = "home";
      });
    });
  }

  function handleSubmitAuth(form) {
    var email = form.email.value.trim();
    var password = form.password.value;
    withBusy(function () {
      state.authError = "";
      var call = state.authMode === "login"
        ? sb.auth.signInWithPassword({ email: email, password: password })
        : sb.auth.signUp({ email: email, password: password });
      return call.then(function (res) {
        if (res.error) { state.authError = res.error.message; return; }
        if (state.authMode === "signup" && res.data && res.data.user && !res.data.session) {
          state.authError = "Controlla la tua email per confermare l'account, poi accedi.";
          state.authMode = "login";
        }
      });
    });
  }

  function handleLogout() {
    withBusy(function () {
      return sb.auth.signOut();
    });
  }

  function openTemplate(id) {
    withBusy(function () {
      state.authError = "";
      var t = state.templates.filter(function (x) { return x.id === id; })[0];
      state.currentTemplate = t;
      state.view = "template";
      return loadTemplateExercises(id);
    });
  }

  function newTemplate() {
    state.authError = "";
    state.currentTemplate = { id: null, name: "" };
    state.currentTemplateExercises = [];
    state.view = "template";
    render();
  }

  function saveTemplateName(name) {
    withBusy(function () {
      state.authError = "";
      if (state.currentTemplate.id) {
        return sb.from("workout_templates").update({ name: name }).eq("id", state.currentTemplate.id)
          .then(function (res) {
            if (res.error) throw res.error;
            state.currentTemplate.name = name;
          });
      }
      return sb.from("workout_templates").insert({ user_id: state.user.id, name: name }).select().single()
        .then(function (res) {
          if (res.error) throw res.error;
          state.currentTemplate = res.data;
          return loadTemplateExercises(res.data.id);
        }).then(loadTemplates);
    });
  }

  function addExercise(name) {
    withBusy(function () {
      state.authError = "";
      var orderIndex = state.currentTemplateExercises.length;
      return sb.from("template_exercises").insert({
        user_id: state.user.id,
        template_id: state.currentTemplate.id,
        name: name,
        order_index: orderIndex
      }).then(function (res) {
        if (res.error) throw res.error;
        return loadTemplateExercises(state.currentTemplate.id);
      });
    });
  }

  function deleteExercise(id) {
    withBusy(function () {
      state.authError = "";
      return sb.from("template_exercises").delete().eq("id", id).then(function (res) {
        if (res.error) throw res.error;
        return loadTemplateExercises(state.currentTemplate.id);
      });
    });
  }

  function deleteTemplate(id) {
    if (!confirm("Eliminare questa scheda e tutti i suoi esercizi?")) return;
    withBusy(function () {
      state.authError = "";
      return sb.from("workout_templates").delete().eq("id", id).then(function (res) {
        if (res.error) throw res.error;
        state.view = "home";
        return loadTemplates();
      });
    });
  }

  function startSession(templateId) {
    withBusy(function () {
      state.authError = "";
      var t = state.templates.filter(function (x) { return x.id === templateId; })[0];
      return sb.from("workout_sessions").insert({
        user_id: state.user.id,
        template_id: templateId,
        template_name: t.name
      }).select().single().then(function (res) {
        if (res.error) throw res.error;
        state.activeSession = res.data;
        return loadSessionData(res.data.id, templateId);
      }).then(function () {
        state.view = "workout";
      });
    });
  }

  function resumeSession() {
    withBusy(function () {
      state.authError = "";
      return loadSessionData(state.activeSession.id, state.activeSession.template_id).then(function () {
        state.view = "workout";
      });
    });
  }

  function addSet(exerciseId, exerciseName, reps, weight) {
    withBusy(function () {
      state.authError = "";
      var existing = state.sessionSets.filter(function (st) { return st.template_exercise_id === exerciseId; });
      var setNumber = existing.length + 1;
      return sb.from("session_sets").insert({
        user_id: state.user.id,
        session_id: state.activeSession.id,
        template_exercise_id: exerciseId,
        exercise_name: exerciseName,
        set_number: setNumber,
        reps: reps,
        weight: weight
      }).then(function (res) {
        if (res.error) throw res.error;
        return loadSessionData(state.activeSession.id, state.activeSession.template_id);
      });
    });
  }

  function finishSession() {
    withBusy(function () {
      state.authError = "";
      return sb.from("workout_sessions").update({ finished_at: new Date().toISOString() }).eq("id", state.activeSession.id)
        .then(function (res) {
          if (res.error) throw res.error;
          state.activeSession = null;
          return Promise.all([loadTemplates(), loadHistory()]);
        }).then(function () {
          state.view = "home";
        });
    });
  }

  function openHistory() {
    withBusy(function () {
      state.authError = "";
      return loadHistory().then(function () { state.view = "history"; });
    });
  }

  function openHistoryDetail(id) {
    withBusy(function () {
      state.authError = "";
      var s = state.history.filter(function (x) { return x.id === id; })[0];
      state.historyDetail = s;
      state.view = "historyDetail";
      return loadHistoryDetail(id);
    });
  }

  function openProfile() {
    withBusy(function () {
      state.authError = "";
      return loadHistory().then(function () { state.view = "profile"; });
    });
  }

  function setTheme(theme) {
    if (THEMES.indexOf(theme) === -1) return;
    state.theme = theme;
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("mydojo-theme", theme); } catch (e) {}
    render();
  }

  // ---------- event delegation ----------

  app.addEventListener("submit", function (e) {
    var form = e.target.closest("form[data-action]");
    if (!form) return;
    e.preventDefault();
    var action = form.getAttribute("data-action");
    if (action === "submit-auth") handleSubmitAuth(form);
    else if (action === "save-template-name") saveTemplateName(form.name.value.trim());
    else if (action === "add-exercise") {
      var name = form.exname.value.trim();
      if (name) { addExercise(name); form.reset(); }
    } else if (action === "add-set") {
      var exId = form.getAttribute("data-exercise-id");
      var exName = form.getAttribute("data-exercise-name");
      var reps = parseInt(form.reps.value, 10);
      var weight = parseFloat(form.weight.value);
      if (!isNaN(reps) && !isNaN(weight)) addSet(exId, exName, reps, weight);
    }
  });

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el || el.tagName === "FORM") return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    if (action === "logout") handleLogout();
    else if (action === "toggle-auth-mode") {
      state.authMode = state.authMode === "login" ? "signup" : "login";
      state.authError = "";
      render();
    }
    else if (action === "nav") {
      var view = el.getAttribute("data-view");
      if (view === "home") goHome();
      else if (view === "history") openHistory();
      else if (view === "profile") openProfile();
    }
    else if (action === "go-home") goHome();
    else if (action === "new-template") newTemplate();
    else if (action === "open-template") openTemplate(id);
    else if (action === "delete-exercise") deleteExercise(id);
    else if (action === "delete-template") deleteTemplate(id);
    else if (action === "start-session") startSession(id);
    else if (action === "resume-session") resumeSession();
    else if (action === "finish-session") finishSession();
    else if (action === "open-history") openHistory();
    else if (action === "open-history-detail") openHistoryDetail(id);
    else if (action === "set-theme") setTheme(el.getAttribute("data-theme"));
  });

  // ---------- boot ----------

  sb.auth.onAuthStateChange(function (event, session) {
    state.user = session ? session.user : null;
    if (!state.user) {
      state.view = "auth";
      render();
    } else if (state.view === "loading" || state.view === "auth") {
      goHome();
    }
  });

  sb.auth.getSession().then(function (res) {
    state.user = res.data.session ? res.data.session.user : null;
    if (state.user) goHome();
    else { state.view = "auth"; render(); }
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>My Dojo</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #1a1d24;
    --surface-2: #22262f;
    --border: #2c3038;
    --text: #f2f3f5;
    --text-dim: #9aa0ac;
    --accent: #ff6b35;
    --accent-dim: #b34c26;
    --danger: #e5484d;
    --ok: #3ecf8e;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 32px;
  }
  header.topbar {
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px 8px;
    border-bottom: 1px solid var(--border);
  }
  header.topbar h1 {
    font-size: 20px;
    margin: 0;
  }
  header.topbar .sub {
    font-size: 13px;
    color: var(--text-dim);
  }
  main {
    flex: 1;
    padding: 16px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: var(--radius);
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface-2);
    color: var(--text);
    width: 100%;
  }
  .btn-primary { background: var(--accent); color: #1a0d05; }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-small { width: auto; padding: 8px 14px; font-size: 13px; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-row .btn { width: auto; flex: 1; }
  input, textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 10px;
  }
  input:focus, textarea:focus { outline: 1px solid var(--accent); }
  label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-title { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .card-meta { font-size: 13px; color: var(--text-dim); margin: 0; }
  .card-tap { cursor: pointer; }
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 16px;
    font-size: 14px;
  }
  .error-msg {
    background: rgba(229,72,77,0.12);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 10px;
  }
  .ok-msg {
    background: rgba(62,207,142,0.12);
    border: 1px solid var(--ok);
    color: var(--ok);
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 10px;
  }
  .exercise-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-2);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .exercise-row .name { font-size: 15px; }
  .exercise-row button {
    background: transparent;
    border: none;
    color: var(--danger);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .set-list { list-style: none; margin: 8px 0; padding: 0; }
  .set-list li {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--text-dim);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .set-form {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    margin-top: 10px;
  }
  .set-form .field { flex: 1; }
  .set-form input { margin-bottom: 0; }
  .set-form button { width: auto; padding: 12px 16px; }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 0;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    padding: 0 0 8px;
  }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-dim);
  }
  .tag.live { background: rgba(255,107,53,0.15); color: var(--accent); }
  form { margin: 0; }
</style>
</head>
<body>
<div id="app"><div class="empty">Caricamento...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://ctfedjwikdgcfqzyzzdn.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0ZmVkandpa2RnY2Zxenl6emRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDk4ODQsImV4cCI6MjEwMjM4NTg4NH0.DHByCjnaddzArYURy8feSfrxo8glx7bs1bTbeYBhEyA";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var state = {
    user: null,
    view: "loading",
    authMode: "login",
    authError: "",
    templates: [],
    currentTemplate: null,
    currentTemplateExercises: [],
    activeSession: null,
    sessionExercises: [],
    sessionSets: [],
    history: [],
    historyDetail: null,
    historyDetailSets: [],
    busy: false
  };

  var app = document.getElementById("app");

  function h(strings) { return strings; }

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    return d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }) +
      " " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  }

  // ---------- render ----------

  function render() {
    if (state.view === "loading") {
      app.innerHTML = '<div class="empty">Caricamento...</div>';
      return;
    }
    if (!state.user) {
      app.innerHTML = renderAuth();
      return;
    }
    var body = "";
    if (state.view === "home") body = renderHome();
    else if (state.view === "template") body = renderTemplateEditor();
    else if (state.view === "workout") body = renderWorkout();
    else if (state.view === "history") body = renderHistory();
    else if (state.view === "historyDetail") body = renderHistoryDetail();
    else body = renderHome();

    app.innerHTML =
      '<header class="topbar">' +
        '<div><h1>My Dojo</h1><div class="sub">' + escapeHtml(state.user.email) + '</div></div>' +
        '<button class="btn btn-ghost btn-small" data-action="logout">Esci</button>' +
      '</header>' +
      '<main>' + body + '</main>';
  }

  function renderAuth() {
    var isLogin = state.authMode === "login";
    return '' +
      '<main style="padding-top:60px;">' +
        '<h1 style="text-align:center;margin-bottom:4px;">My Dojo</h1>' +
        '<p style="text-align:center;color:var(--text-dim);margin-top:0;margin-bottom:24px;">Le tue schede, i tuoi progressi.</p>' +
        (state.authError ? '<div class="error-msg">' + escapeHtml(state.authError) + '</div>' : '') +
        '<form data-action="submit-auth">' +
          '<label>Email</label>' +
          '<input type="email" name="email" required autocomplete="email">' +
          '<label>Password</label>' +
          '<input type="password" name="password" required autocomplete="' + (isLogin ? "current-password" : "new-password") + '" minlength="6">' +
          '<button class="btn btn-primary" type="submit" ' + (state.busy ? "disabled" : "") + '>' +
            (isLogin ? "Entra" : "Crea account") +
          '</button>' +
        '</form>' +
        '<p style="text-align:center;margin-top:16px;">' +
          (isLogin ? "Non hai un account? " : "Hai già un account? ") +
          '<button class="link-btn" data-action="toggle-auth-mode">' + (isLogin ? "Registrati" : "Accedi") + '</button>' +
        '</p>' +
      '</main>';
  }

  function renderHome() {
    var html = "";

    if (state.activeSession) {
      html += '<div class="card card-tap" data-action="resume-session">' +
        '<span class="tag live">In corso</span>' +
        '<p class="card-title" style="margin-top:8px;">' + escapeHtml(state.activeSession.template_name) + '</p>' +
        '<p class="card-meta">Iniziato il ' + formatDate(state.activeSession.started_at) + ' — tocca per riprendere</p>' +
      '</div>';
    }

    html += '<button class="btn btn-primary" data-action="new-template" style="margin-bottom:16px;">+ Nuova scheda</button>';

    if (state.templates.length === 0) {
      html += '<div class="empty">Non hai ancora nessuna scheda.<br>Creane una per iniziare.</div>';
    } else {
      state.templates.forEach(function (t) {
        html += '<div class="card">' +
          '<div class="card-tap" data-action="open-template" data-id="' + t.id + '">' +
            '<p class="card-title">' + escapeHtml(t.name) + '</p>' +
            '<p class="card-meta">Creata il ' + formatDate(t.created_at) + '</p>' +
          '</div>' +
          '<div class="btn-row">' +
            '<button class="btn btn-primary btn-small" data-action="start-session" data-id="' + t.id + '" ' + (state.activeSession ? "disabled" : "") + '>Inizia allenamento</button>' +
            '<button class="btn btn-ghost btn-small" data-action="open-template" data-id="' + t.id + '">Modifica</button>' +
          '</div>' +
        '</div>';
      });
    }

    html += '<button class="link-btn" data-action="open-history" style="margin-top:12px;">Vedi storico allenamenti →</button>';
    return html;
  }

  function renderTemplateEditor() {
    var t = state.currentTemplate;
    var html = '<button class="back-btn" data-action="go-home">← Indietro</button>';
    html += '<h2 style="margin-top:0;">' + (t.id ? "Modifica scheda" : "Nuova scheda") + '</h2>';

    if (state.authError) html += '<div class="error-msg">' + escapeHtml(state.authError) + '</div>';

    html += '<form data-action="save-template-name">' +
      '<label>Nome scheda</label>' +
      '<input type="text" name="name" value="' + escapeHtml(t.name || "") + '" placeholder="Es. Petto/Tricipiti" required>' +
      '<button class="btn btn-primary" type="submit">' + (t.id ? "Salva nome" : "Crea scheda") + '</button>' +
    '</form>';

    if (t.id) {
      html += '<h3 style="margin-top:24px;">Esercizi</h3>';
      if (state.currentTemplateExercises.length === 0) {
        html += '<p class="card-meta">Nessun esercizio ancora aggiunto.</p>';
      } else {
        state.currentTemplateExercises.forEach(function (ex) {
          html += '<div class="exercise-row">' +
            '<span class="name">' + escapeHtml(ex.name) + '</span>' +
            '<button data-action="delete-exercise" data-id="' + ex.id + '">&times;</button>' +
          '</div>';
        });
      }
      html += '<form data-action="add-exercise" style="margin-top:12px;display:flex;gap:8px;">' +
        '<input type="text" name="exname" placeholder="Nome esercizio" required style="margin-bottom:0;">' +
        '<button class="btn btn-primary" type="submit" style="width:auto;">+</button>' +
      '</form>';

      html += '<button class="btn btn-danger" data-action="delete-template" data-id="' + t.id + '" style="margin-top:24px;">Elimina scheda</button>';
    }

    return html;
  }

  function renderWorkout() {
    var s = state.activeSession;
    var html = '<button class="back-btn" data-action="go-home">← Indietro</button>';
    html += '<h2 style="margin-top:0;">' + escapeHtml(s.template_name) + '</h2>';
    html += '<p class="card-meta">Iniziato il ' + formatDate(s.started_at) + '</p>';

    if (state.sessionExercises.length === 0) {
      html += '<div class="empty">Questa scheda non ha esercizi. Aggiungili prima di allenarti.</div>';
    }

    state.sessionExercises.forEach(function (ex) {
      var sets = state.sessionSets.filter(function (st) { return st.template_exercise_id === ex.id; });
      html += '<div class="card">' +
        '<p class="card-title">' + escapeHtml(ex.name) + '</p>';

      if (sets.length > 0) {
        html += '<ul class="set-list">';
        sets.forEach(function (st) {
          html += '<li><span>Serie ' + st.set_number + '</span><span>' + st.reps + ' rip. × ' + st.weight + ' kg</span></li>';
        });
        html += '</ul>';
      }

      html += '<form class="set-form" data-action="add-set" data-exercise-id="' + ex.id + '" data-exercise-name="' + escapeHtml(ex.name) + '">' +
        '<div class="field"><label>Ripetizioni</label><input type="number" name="reps" min="0" required></div>' +
        '<div class="field"><label>Peso (kg)</label><input type="number" name="weight" min="0" step="0.5" required></div>' +
        '<button class="btn btn-primary" type="submit">+</button>' +
      '</form>' +
      '</div>';
    });

    html += '<button class="btn btn-primary" data-action="finish-session" style="margin-top:16px;">Termina allenamento</button>';
    return html;
  }

  function renderHistory() {
    var html = '<button class="back-btn" data-action="go-home">← Indietro</button>';
    html += '<h2 style="margin-top:0;">Storico</h2>';
    if (state.history.length === 0) {
      html += '<div class="empty">Nessun allenamento registrato ancora.</div>';
    } else {
      state.history.forEach(function (s) {
        html += '<div class="card card-tap" data-action="open-history-detail" data-id="' + s.id + '">' +
          '<p class="card-title">' + escapeHtml(s.template_name) + (s.finished_at ? "" : ' <span class="tag live">In corso</span>') + '</p>' +
          '<p class="card-meta">' + formatDate(s.started_at) + '</p>' +
        '</div>';
      });
    }
    return html;
  }

  function renderHistoryDetail() {
    var s = state.historyDetail;
    var html = '<button class="back-btn" data-action="open-history">← Indietro</button>';
    html += '<h2 style="margin-top:0;">' + escapeHtml(s.template_name) + '</h2>';
    html += '<p class="card-meta">' + formatDate(s.started_at) +
      (s.finished_at ? " — durata " + durationText(s.started_at, s.finished_at) : " — in corso") + '</p>';

    var byExercise = {};
    var order = [];
    state.historyDetailSets.forEach(function (st) {
      if (!byExercise[st.exercise_name]) { byExercise[st.exercise_name] = []; order.push(st.exercise_name); }
      byExercise[st.exercise_name].push(st);
    });

    if (order.length === 0) {
      html += '<div class="empty">Nessuna serie registrata in questo allenamento.</div>';
    } else {
      order.forEach(function (name) {
        html += '<div class="card"><p class="card-title">' + escapeHtml(name) + '</p><ul class="set-list">';
        byExercise[name].forEach(function (st) {
          html += '<li><span>Serie ' + st.set_number + '</span><span>' + st.reps + ' rip. × ' + st.weight + ' kg</span></li>';
        });
        html += '</ul></div>';
      });
    }
    return html;
  }

  function durationText(start, end) {
    var mins = Math.max(0, Math.round((new Date(end) - new Date(start)) / 60000));
    if (mins < 60) return mins + " min";
    return Math.floor(mins / 60) + "h " + (mins % 60) + "min";
  }

  // ---------- data loading ----------

  function loadTemplates() {
    return sb.from("workout_templates").select("*").order("created_at", { ascending: false })
      .then(function (res) {
        if (res.error) throw res.error;
        state.templates = res.data;
      });
  }

  function loadActiveSession() {
    return sb.from("workout_sessions").select("*").is("finished_at", null)
      .order("started_at", { ascending: false }).limit(1)
      .then(function (res) {
        if (res.error) throw res.error;
        state.activeSession = res.data && res.data.length ? res.data[0] : null;
      });
  }

  function loadTemplateExercises(templateId) {
    return sb.from("template_exercises").select("*").eq("template_id", templateId).order("order_index", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        state.currentTemplateExercises = res.data;
      });
  }

  function loadSessionData(sessionId, templateId) {
    var p1 = templateId
      ? sb.from("template_exercises").select("*").eq("template_id", templateId).order("order_index", { ascending: true })
      : Promise.resolve({ data: [] });
    var p2 = sb.from("session_sets").select("*").eq("session_id", sessionId).order("created_at", { ascending: true });
    return Promise.all([p1, p2]).then(function (results) {
      if (results[0].error) throw results[0].error;
      if (results[1].error) throw results[1].error;
      state.sessionExercises = results[0].data;
      state.sessionSets = results[1].data;
    });
  }

  function loadHistory() {
    return sb.from("workout_sessions").select("*").order("started_at", { ascending: false })
      .then(function (res) {
        if (res.error) throw res.error;
        state.history = res.data;
      });
  }

  function loadHistoryDetail(sessionId) {
    return sb.from("session_sets").select("*").eq("session_id", sessionId).order("created_at", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        state.historyDetailSets = res.data;
      });
  }

  // ---------- actions ----------

  function withBusy(fn) {
    if (state.busy) return;
    state.busy = true;
    return Promise.resolve().then(fn).catch(function (err) {
      state.authError = (err && err.message) || String(err);
    }).then(function () {
      state.busy = false;
      render();
    });
  }

  function goHome() {
    withBusy(function () {
      state.authError = "";
      return Promise.all([loadTemplates(), loadActiveSession()]).then(function () {
        state.view = "home";
      });
    });
  }

  function handleSubmitAuth(form) {
    var email = form.email.value.trim();
    var password = form.password.value;
    withBusy(function () {
      state.authError = "";
      var call = state.authMode === "login"
        ? sb.auth.signInWithPassword({ email: email, password: password })
        : sb.auth.signUp({ email: email, password: password });
      return call.then(function (res) {
        if (res.error) { state.authError = res.error.message; return; }
        if (state.authMode === "signup" && res.data && res.data.user && !res.data.session) {
          state.authError = "Controlla la tua email per confermare l'account, poi accedi.";
          state.authMode = "login";
        }
      });
    });
  }

  function handleLogout() {
    withBusy(function () {
      return sb.auth.signOut();
    });
  }

  function openTemplate(id) {
    withBusy(function () {
      state.authError = "";
      var t = state.templates.filter(function (x) { return x.id === id; })[0];
      state.currentTemplate = t;
      state.view = "template";
      return loadTemplateExercises(id);
    });
  }

  function newTemplate() {
    state.authError = "";
    state.currentTemplate = { id: null, name: "" };
    state.currentTemplateExercises = [];
    state.view = "template";
    render();
  }

  function saveTemplateName(name) {
    withBusy(function () {
      state.authError = "";
      if (state.currentTemplate.id) {
        return sb.from("workout_templates").update({ name: name }).eq("id", state.currentTemplate.id)
          .then(function (res) {
            if (res.error) throw res.error;
            state.currentTemplate.name = name;
          });
      }
      return sb.from("workout_templates").insert({ user_id: state.user.id, name: name }).select().single()
        .then(function (res) {
          if (res.error) throw res.error;
          state.currentTemplate = res.data;
          return loadTemplateExercises(res.data.id);
        }).then(loadTemplates);
    });
  }

  function addExercise(name) {
    withBusy(function () {
      state.authError = "";
      var orderIndex = state.currentTemplateExercises.length;
      return sb.from("template_exercises").insert({
        user_id: state.user.id,
        template_id: state.currentTemplate.id,
        name: name,
        order_index: orderIndex
      }).then(function (res) {
        if (res.error) throw res.error;
        return loadTemplateExercises(state.currentTemplate.id);
      });
    });
  }

  function deleteExercise(id) {
    withBusy(function () {
      state.authError = "";
      return sb.from("template_exercises").delete().eq("id", id).then(function (res) {
        if (res.error) throw res.error;
        return loadTemplateExercises(state.currentTemplate.id);
      });
    });
  }

  function deleteTemplate(id) {
    if (!confirm("Eliminare questa scheda e tutti i suoi esercizi?")) return;
    withBusy(function () {
      state.authError = "";
      return sb.from("workout_templates").delete().eq("id", id).then(function (res) {
        if (res.error) throw res.error;
        state.view = "home";
        return loadTemplates();
      });
    });
  }

  function startSession(templateId) {
    withBusy(function () {
      state.authError = "";
      var t = state.templates.filter(function (x) { return x.id === templateId; })[0];
      return sb.from("workout_sessions").insert({
        user_id: state.user.id,
        template_id: templateId,
        template_name: t.name
      }).select().single().then(function (res) {
        if (res.error) throw res.error;
        state.activeSession = res.data;
        return loadSessionData(res.data.id, templateId);
      }).then(function () {
        state.view = "workout";
      });
    });
  }

  function resumeSession() {
    withBusy(function () {
      state.authError = "";
      return loadSessionData(state.activeSession.id, state.activeSession.template_id).then(function () {
        state.view = "workout";
      });
    });
  }

  function addSet(exerciseId, exerciseName, reps, weight) {
    withBusy(function () {
      state.authError = "";
      var existing = state.sessionSets.filter(function (st) { return st.template_exercise_id === exerciseId; });
      var setNumber = existing.length + 1;
      return sb.from("session_sets").insert({
        user_id: state.user.id,
        session_id: state.activeSession.id,
        template_exercise_id: exerciseId,
        exercise_name: exerciseName,
        set_number: setNumber,
        reps: reps,
        weight: weight
      }).then(function (res) {
        if (res.error) throw res.error;
        return loadSessionData(state.activeSession.id, state.activeSession.template_id);
      });
    });
  }

  function finishSession() {
    withBusy(function () {
      state.authError = "";
      return sb.from("workout_sessions").update({ finished_at: new Date().toISOString() }).eq("id", state.activeSession.id)
        .then(function (res) {
          if (res.error) throw res.error;
          state.activeSession = null;
          return loadTemplates();
        }).then(function () {
          state.view = "home";
        });
    });
  }

  function openHistory() {
    withBusy(function () {
      state.authError = "";
      return loadHistory().then(function () { state.view = "history"; });
    });
  }

  function openHistoryDetail(id) {
    withBusy(function () {
      state.authError = "";
      var s = state.history.filter(function (x) { return x.id === id; })[0];
      state.historyDetail = s;
      state.view = "historyDetail";
      return loadHistoryDetail(id);
    });
  }

  // ---------- event delegation ----------

  app.addEventListener("submit", function (e) {
    var form = e.target.closest("form[data-action]");
    if (!form) return;
    e.preventDefault();
    var action = form.getAttribute("data-action");
    if (action === "submit-auth") handleSubmitAuth(form);
    else if (action === "save-template-name") saveTemplateName(form.name.value.trim());
    else if (action === "add-exercise") {
      var name = form.exname.value.trim();
      if (name) { addExercise(name); form.reset(); }
    } else if (action === "add-set") {
      var exId = form.getAttribute("data-exercise-id");
      var exName = form.getAttribute("data-exercise-name");
      var reps = parseInt(form.reps.value, 10);
      var weight = parseFloat(form.weight.value);
      if (!isNaN(reps) && !isNaN(weight)) addSet(exId, exName, reps, weight);
    }
  });

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el || el.tagName === "FORM") return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    if (action === "logout") handleLogout();
    else if (action === "toggle-auth-mode") {
      state.authMode = state.authMode === "login" ? "signup" : "login";
      state.authError = "";
      render();
    }
    else if (action === "go-home") goHome();
    else if (action === "new-template") newTemplate();
    else if (action === "open-template") openTemplate(id);
    else if (action === "delete-exercise") deleteExercise(id);
    else if (action === "delete-template") deleteTemplate(id);
    else if (action === "start-session") startSession(id);
    else if (action === "resume-session") resumeSession();
    else if (action === "finish-session") finishSession();
    else if (action === "open-history") openHistory();
    else if (action === "open-history-detail") openHistoryDetail(id);
  });

  // ---------- boot ----------

  sb.auth.onAuthStateChange(function (event, session) {
    state.user = session ? session.user : null;
    if (!state.user) {
      state.view = "auth";
      render();
    } else if (state.view === "loading" || state.view === "auth") {
      goHome();
    }
  });

  sb.auth.getSession().then(function (res) {
    state.user = res.data.session ? res.data.session.user : null;
    if (state.user) goHome();
    else { state.view = "auth"; render(); }
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>My Dojo</title>
<link rel="icon" type="image/png" href="Logo/favicon.png">
<link rel="apple-touch-icon" href="Logo/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbf3ed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf3ed;
    --surface: #ffffff;
    --surface-2: #f8e9dd;
    --border: #ecdccb;
    --text: #282d31;
    --text-dim: #55595f;
    --accent: #f1a39f;
    --accent-ink: #282d31;
    --cta: #f1a39f;
    --cta-ink: #282d31;
    --danger: #e0574f;
    --danger-bg: rgba(224,87,79,0.12);
    --ok: #7fae8e;
    --radius-lg: 22px;
    --radius: 16px;
    --radius-sm: 12px;
  }
  html[data-theme="scuro"] {
    --bg: #282d31;
    --surface: #383d42;
    --surface-2: #313539;
    --border: #454a50;
    --text: #fbf3ed;
    --text-dim: #a9adb2;
    --accent: #f1a39f;
    --accent-ink: #282d31;
    --cta: #f1a39f;
    --cta-ink: #282d31;
    --danger-bg: rgba(224,87,79,0.2);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: 90px;
  }
  main.screen { padding: 20px 18px 24px; }
  h1.page-title {
    font-size: 28px;
    font-weight: 700;
    margin: 6px 0 4px;
    letter-spacing: -0.02em;
  }
  p.page-sub { color: var(--text-dim); margin: 0 0 20px; font-size: 14px; }

  .back-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 999px;
    font-size: 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 999px;
    padding: 15px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-cta { background: var(--cta); color: var(--cta-ink); }
  .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-small { width: auto; padding: 10px 16px; font-size: 13px; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .btn { width: auto; flex: 1; }
  .btn[disabled] { opacity: 0.5; cursor: default; }

  input, textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 12px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 5px; font-weight: 600; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-bottom: 14px;
  }

  .hero-card {
    border-radius: var(--radius-lg);
    padding: 22px;
    margin-bottom: 16px;
    color: var(--text);
    position: relative;
    overflow: hidden;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    cursor: pointer;
    border: 1px solid rgba(40,45,49,0.06);
  }
  .hero-card .hero-icon {
    position: absolute;
    right: -10px;
    top: -10px;
    font-size: 90px;
    opacity: 0.22;
    line-height: 1;
  }
  .hero-card .hero-title { font-size: 19px; font-weight: 700; margin: 0; }
  .hero-card .hero-meta { font-size: 13px; color: var(--text-dim); margin: 2px 0 0; }
  .hero-card.live { box-shadow: 0 0 0 3px var(--cta); }
  .cat-banner-img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    cursor: pointer;
    border: 1px solid rgba(40,45,49,0.06);
  }
  .workout-banner-wrap { position: relative; margin-bottom: 8px; cursor: pointer; }
  .workout-banner-img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(40,45,49,0.06);
  }
  .workout-banner-badge { position: absolute; top: 8px; right: 8px; }

  .view-mode-toggle { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; margin-top: 12px; }
  .view-mode-btn { flex: 1; background: transparent; border: none; border-radius: 999px; padding: 8px 0; font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; }
  .view-mode-btn.active { background: var(--accent); color: var(--accent-ink); }

  .greeting-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .greeting-card .mascot-badge { width: 48px; height: 48px; flex-shrink: 0; }
  .greeting-text { min-width: 0; flex: 1; }
  .greeting-msg { margin: 0 0 6px; font-size: 14px; font-weight: 700; line-height: 1.3; }
  .greeting-level-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .level-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .level-title-inline { font-size: 12.5px; font-weight: 700; }
  .level-progress-bar { width: 100%; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .level-progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .greeting-meta { font-size: 11px; color: var(--text-dim); margin: 4px 0 0; }
  .greeting-tip-inline { font-size: 11.5px; color: var(--text-dim); margin: 6px 0 0; padding-top: 6px; border-top: 1px solid var(--border); }

  .season-recap-card {
    position: relative;
    background: linear-gradient(135deg, var(--accent), var(--cta));
    color: var(--accent-ink);
    text-align: center;
    padding: 16px 30px;
  }
  .season-recap-close {
    position: absolute;
    top: 8px;
    right: 10px;
    background: none;
    border: none;
    font-size: 18px;
    line-height: 1;
    color: var(--accent-ink);
    opacity: 0.7;
    cursor: pointer;
    padding: 4px;
  }
  .season-recap-msg { margin: 0 0 4px; font-size: 13.5px; font-weight: 700; line-height: 1.35; }
  .season-recap-msg2 { margin: 0; font-size: 12.5px; font-weight: 600; opacity: 0.85; }

  .season-history-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .season-history-label { margin: 0; font-weight: 700; font-size: 14px; }
  .season-history-count { margin: 2px 0 0; font-size: 12px; color: var(--text-dim); }
  .season-history-level { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; text-align: right; }

  .plan-top-row { display: flex; align-items: stretch; gap: 10px; margin-bottom: 10px; }
  .plan-top-row .greeting-card { flex: 1; min-width: 0; margin-bottom: 0; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; }
  .plan-top-row .greeting-card .mascot-badge { width: 32px; height: 32px; }
  .plan-top-row .greeting-card .greeting-msg { font-size: 12px; line-height: 1.25; margin-bottom: 4px; }
  .plan-top-row .greeting-card .level-title-inline,
  .plan-top-row .greeting-card .greeting-meta,
  .plan-top-row .greeting-card .greeting-tip-inline { display: none; }
  .plan-action-card {
    flex: 1;
    min-width: 0;
    border-radius: var(--radius-lg);
    padding: 12px;
    color: var(--text);
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    border: 1px solid rgba(40,45,49,0.06);
  }
  .plan-action-card.live { box-shadow: 0 0 0 2px var(--cta); }
  .plan-action-card .tag { font-size: 10px; padding: 3px 8px; width: fit-content; margin-bottom: 5px; }
  .plan-action-card .action-title { font-size: 13px; font-weight: 700; margin: 0; }
  .plan-action-card .action-meta { font-size: 10.5px; color: var(--text-dim); margin: 3px 0 0; line-height: 1.25; }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.25);
    color: #fff;
    backdrop-filter: blur(2px);
  }
  .tag-solid { background: var(--cta); color: var(--cta-ink); }

  .stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .stat-tile {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
  }
  .stat-tile .num { font-size: 22px; font-weight: 700; display: block; }
  .stat-tile .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }

  .empty { text-align: center; color: var(--text-dim); padding: 40px 16px; font-size: 14px; }
  .error-msg, .info-msg {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin-bottom: 12px;
  }
  .error-msg { background: var(--danger-bg); color: var(--danger); }
  .info-msg { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
  .flash-msg {
    background: rgba(22, 163, 74, 0.12);
    color: var(--ok);
    border: 1px solid var(--ok);
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .exercise-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    margin-bottom: 8px;
  }
  .exercise-row .name { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: break-word; }
  .exercise-row > button {
    background: transparent;
    border: none;
    color: var(--danger);
    font-size: 20px;
    cursor: pointer;
    padding: 2px 8px;
    line-height: 1;
    flex-shrink: 0;
  }
  .exercise-reorder { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .exercise-reorder button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1.1;
  }
  .exercise-reorder button:disabled { opacity: 0.25; cursor: default; }
  .exercise-duration-input {
    width: 52px;
    flex-shrink: 0;
    flex-grow: 0;
    text-align: center;
    padding: 6px 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-family: inherit;
  }

  .heatmap-grid { display: flex; gap: 3px; overflow-x: auto; padding: 2px; }
  .heatmap-col { display: flex; flex-direction: column; gap: 3px; }
  .heatmap-cell { width: 11px; height: 11px; border-radius: 3px; background: var(--surface-2); }
  .heatmap-cell.trained { background: var(--cta); }
  .heatmap-cell.future { visibility: hidden; }

  .link-btn { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; }

  form.inline-add { display: flex; gap: 8px; margin-top: 12px; }
  form.inline-add input { margin-bottom: 0; }
  form.inline-add button { width: auto; padding: 13px 18px; }

  .busy-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    z-index: 50;
    background: var(--accent);
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 50% 100%;
    animation: busy-bar-slide 1.1s ease-in-out infinite;
  }
  @keyframes busy-bar-slide {
    0% { background-position: -50% 0; }
    100% { background-position: 150% 0; }
  }

  .session-summary { text-align: center; padding-top: 18px; animation: summary-pop 0.45s cubic-bezier(.2,1.4,.4,1); }
  .session-summary-mascot { display: flex; justify-content: center; margin-bottom: 8px; }
  .session-summary-title { font-size: 24px; margin: 4px 0 2px; }
  .session-summary-sub { color: var(--text-dim); margin: 0 0 4px; font-weight: 600; }
  .session-summary .stats-row { text-align: left; }
  .session-summary .section-title { text-align: left; }
  .session-summary .card { text-align: left; }
  .session-summary-streak {
    margin-top: 10px;
    font-weight: 700;
    text-align: center;
    font-size: 15px;
    background: var(--surface-2);
  }
  @keyframes summary-pop {
    0% { opacity: 0; transform: scale(0.85) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .level-up-card {
    margin: 14px 0 4px;
    padding: 18px 16px;
    border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--accent), var(--cta));
    color: var(--accent-ink);
    text-align: center;
    animation: level-up-pop 0.5s cubic-bezier(.2,1.6,.4,1) 0.15s backwards;
  }
  .level-up-tag { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; margin: 0 0 4px; opacity: 0.85; }
  .level-up-num { font-size: 26px; font-weight: 700; margin: 0; }
  .level-up-title { font-size: 16px; font-weight: 700; margin: 2px 0 0; }
  @keyframes level-up-pop {
    0% { opacity: 0; transform: scale(0.7); }
    60% { opacity: 1; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* bottom nav */
  nav.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  nav.bottom-nav button {
    flex: 1;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 0;
    border-radius: var(--radius-sm);
  }
  nav.bottom-nav .nav-icon-chip {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 2px solid transparent;
  }
  nav.bottom-nav .nav-icon-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  nav.bottom-nav button.active { color: var(--accent); }
  nav.bottom-nav button.active .nav-icon-chip { border-color: var(--accent); }

  /* fixed bottom CTA (workout screen) */
  .fixed-cta {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    z-index: 20;
  }

  /* profile */
  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    margin: 8px auto 12px;
  }
  .profile-header { text-align: center; margin-bottom: 22px; }
  .profile-header .email { color: var(--text-dim); font-size: 14px; }

  .theme-row { display: flex; gap: 10px; margin-top: 8px; }
  .theme-swatch {
    flex: 1;
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
  }
  .theme-swatch.selected { border-color: var(--accent); }
  .theme-swatch .dot { width: 20px; height: 20px; border-radius: 999px; margin: 0 auto 8px; border: 1px solid var(--border); }

  h3.section-title { font-size: 15px; font-weight: 700; margin: 22px 0 10px; }

  /* header in cima alle pagine principali */
  header.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 4px;
  }
  header.app-header .logo-mark { width: 52px; height: 52px; flex-shrink: 0; display: block; }
  header.app-header .logo-mark img { width: 100%; height: 100%; border-radius: 999px; object-fit: cover; display: block; }
  .mascot-badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  .mascot-badge .mascot-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mascot-badge img { position: relative; z-index: 1; display: block; height: auto; }
  .login-mascot { width: 170px; height: 170px; margin: 0 auto 8px; }
  header.app-header .header-brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  header.app-header .brand-name { font-size: 19px; font-weight: 700; color: var(--text); white-space: nowrap; }
  header.app-header .brand-name .brand-accent { color: var(--accent); }
  header.app-header .header-greet {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
  }
  header.app-header .greet-text { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
  header.app-header .profile-avatar {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    object-fit: cover;
    display: block;
    flex-shrink: 0;
  }

  /* circuito a tempo */
  .circuit-progress { color: var(--text-dim); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin: 4px 0 6px; }
  .circuit-phase-tag { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 8px; }
  .circuit-phase-tag.work { background: var(--accent); color: var(--accent-ink); }
  .circuit-phase-tag.rest { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
  .circuit-exname { font-size: 22px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.02em; }
  .circuit-top-row { display: flex; align-items: center; justify-content: space-between; }
  .circuit-ring-wrap { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
  .circuit-ring { width: 92px; height: 92px; transform: rotate(-90deg); }
  .circuit-ring-track { fill: none; stroke: var(--surface-2); stroke-width: 6; }
  .circuit-ring-fill { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .circuit-ring-fill.rest { stroke: var(--text-dim); }
  .circuit-ring-number { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* libreria esercizi */
  select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 12px;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .pill-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .pill.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .exlib-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .exlib-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0;

  function computeLevel(sessionsDone) {
    var idx = 0;
    for (var i = 0; i < LEVELS.length; i++) {
      if (sessionsDone >= LEVELS[i].threshold) idx = i;
    }
    var current = LEVELS[idx];
    var next = LEVELS[idx + 1] || null;
    var span = next ? next.threshold - current.threshold : 0;
    var progressPct = next ? Math.min(100, Math.round((sessionsDone - current.threshold) / span * 100)) : 100;
    return {
      level: idx + 1,
      title: current.title,
      sessionsDone: sessionsDone,
      sessionsToNext: next ? next.threshold - sessionsDone : 0,
      nextTitle: next ? next.title : null,
      isMaxLevel: !next,

  // ---------- stagioni (livello che si azzera ogni trimestre, come le "stagioni" dei giochi online) ----------

  function seasonInfoFromDate(date) {
    var y = date.getFullYear();
    var md = date.getMonth() * 100 + date.getDate();
    if (md >= 1121) return { season: "Inverno", year: y + 1 };
    if (md >= 821) return { season: "Autunno", year: y };
    if (md >= 521) return { season: "Estate", year: y };
    if (md >= 220) return { season: "Primavera", year: y };
    return { season: "Inverno", year: y };
  }

  function seasonBounds(season, year) {
    var ranges = {
      Inverno: [new Date(year - 1, 11, 21), new Date(year, 2, 20)],
      Primavera: [new Date(year, 2, 20), new Date(year, 5, 21)],
      Estate: [new Date(year, 5, 21), new Date(year, 8, 21)],
      Autunno: [new Date(year, 8, 21), new Date(year, 11, 21)]
    };
    return { start: ranges[season][0], end: ranges[season][1] };
  }

  function seasonKey(season, year) { return season + "-" + year; }
  function seasonLabel(season, year) { return season + " " + year; }

  function getCurrentSeason() {
    var info = seasonInfoFromDate(new Date());
    var bounds = seasonBounds(info.season, info.year);
    return {
      season: info.season,
      year: info.year,
      key: seasonKey(info.season, info.year),
      label: seasonLabel(info.season, info.year),
      start: bounds.start,
      end: bounds.end
    };
  }

  function countSessionsInRange(start, end) {
    return state.history.filter(function (s) {
      if (!s.finished_at) return false;
      var d = new Date(s.finished_at);
      return d >= start && d < end;
    }).length;
  }

  function getPastSeasons() {
    var current = getCurrentSeason();
    var map = {};
    state.history.forEach(function (s) {
      if (!s.finished_at) return;
      var d = new Date(s.finished_at);
      var info = seasonInfoFromDate(d);
      var key = seasonKey(info.season, info.year);
      if (key === current.key) return;
      if (!map[key]) {
        var bounds = seasonBounds(info.season, info.year);
        map[key] = { season: info.season, year: info.year, key: key, label: seasonLabel(info.season, info.year), start: bounds.start, count: 0 };
      }
      map[key].count++;
    });
    var list = [];
    for (var k in map) list.push(map[k]);
    list.sort(function (a, b) { return b.start - a.start; });
    list.forEach(function (s) { s.levelInfo = computeLevel(s.count); });
    return list;
  }

  function getBestSeasonLevel(currentSeasonLevelInfo) {
    var best = currentSeasonLevelInfo;
    getPastSeasons().forEach(function (s) {
      if (s.levelInfo.level > best.level) best = s.levelInfo;
    });
    return best;
  }

    var m = Math.floor((secs % 3600) / 60);
    var s = secs % 60;
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    return (h > 0 ? h + ":" + pad(m) : m) + ":" + pad(s);
  }

  function stopWorkoutTimer() {
    if (workoutTimerHandle) { clearInterval(workoutTimerHandle); workoutTimerHandle = null; }
  }

  function startWorkoutTimer(startedAt) {
    stopWorkoutTimer();
    workoutTimerHandle = setInterval(function () {
      var el = document.getElementById("workout-elapsed");
      if (!el) { stopWorkoutTimer(); return; }
      el.textContent = elapsedText(startedAt);
    }, 1000);
  }

  function isCircuitSession() {
    return state.sessionExercises.length > 0 && state.sessionExercises.every(function (ex) { return ex.duration_seconds != null; });
  }

  function initCircuitIfNeeded() {
    if (isCircuitSession()) {
      if (!state.circuit) {
        state.circuit = { index: 0, phase: "work", secondsLeft: state.sessionExercises[0].duration_seconds, paused: false };
      }
    } else {
      state.circuit = null;
    }
  }

  function stopCircuitTimer() {
    if (circuitTimerHandle) { clearInterval(circuitTimerHandle); circuitTimerHandle = null; }
  }

  function startCircuitTimer() {
    stopCircuitTimer();
    circuitTimerHandle = setInterval(tickCircuit, 1000);
  }

  function updateCircuitDom() {
    var c = state.circuit;
    var secEl = document.getElementById("circuit-seconds");
    var ringEl = document.getElementById("circuit-ring-fill");
    if (!c || !secEl) return;
    var current = state.sessionExercises[c.index];
    var totalForPhase = c.phase === "rest" ? restSecondsFor(state.activeSession) : current.duration_seconds;
    secEl.textContent = c.secondsLeft;
    if (ringEl) {
      var pct = Math.max(0, Math.min(100, Math.round((c.secondsLeft / totalForPhase) * 100)));
      var circumference = 2 * Math.PI * 28;
      ringEl.style.strokeDashoffset = (circumference * (1 - pct / 100)).toFixed(2);
    }
  }

  function tickCircuit() {
    if (!state.circuit || state.circuit.paused) return;
    state.circuit.secondsLeft -= 1;
    if (state.circuit.secondsLeft <= 0) {
      advanceCircuitPhase();
    } else {
      if (state.circuit.secondsLeft <= 3) beep(660, 90);
      updateCircuitDom();
    }
  }

  function advanceCircuitPhase() {
    var c = state.circuit;
    var exs = state.sessionExercises;
    if (c.phase === "work") {
      if (c.index >= exs.length - 1) {
        completeCircuit();
        return;
      }
      c.phase = "rest";
      c.secondsLeft = restSecondsFor(state.activeSession);
    } else {
      c.index += 1;
      c.phase = "work";
      c.secondsLeft = exs[c.index].duration_seconds;
    }
    beep(880, 180);
    vibrate(150);
    render();
  }

  function skipCircuitPhase() {
    if (!state.circuit) return;
    advanceCircuitPhase();
  }

  function toggleCircuitPause() {
    if (!state.circuit) return;
    state.circuit.paused = !state.circuit.paused;
    render();
  }

  function completeCircuit() {
    stopCircuitTimer();
    state.circuit = null;
    beep(440, 400);
    vibrate([120, 60, 120]);
    finishSession();
  }

  // ---------- render ----------

  var lastRenderedView = null;
  var viewScrollMemory = {};

  function busyBar() {
    return state.busy ? '<div class="busy-bar"></div>' : "";
  }

  function render() {
    if (state.view !== "workout") { stopWorkoutTimer(); stopCircuitTimer(); }
    if (state.view !== "benessere") {
      stopBreathingTimer(); state.breathing = null;
      stopMeditationTimer(); state.meditation = null;
    }

    if (state.view === "loading") {
      app.innerHTML = busyBar() + '<div class="empty">Caricamento...</div>';
      return;
    }
    if (!state.user) {
      app.innerHTML = busyBar() + renderAuth();
      return;
    }

    var knownViews = ["home", "template", "workout", "history", "historyDetail", "profile", "categoryDetail", "workoutDetail", "presetAdmin", "benessere", "library", "libraryDetail", "libraryForm", "plan", "planEditDay", "planMessagesAdmin", "sessionSummary"];
    if (knownViews.indexOf(state.view) === -1) state.view = "plan";

    var tabs = ["plan", "home", "benessere", "history"];
    var showNav = tabs.indexOf(state.view) !== -1;
    var tabTitles = { plan: "Il mio piano", home: "Corpo", history: "Statistiche", benessere: "Mente" };
    var body = "";
    try {
      if (state.view === "plan") body = renderPlan();
      else if (state.view === "planEditDay") body = renderPlanEditDay();
      else if (state.view === "home") body = renderHome();
      else if (state.view === "template") body = renderTemplateEditor();
      else if (state.view === "workout") body = renderWorkout();
      else if (state.view === "sessionSummary") body = renderSessionSummary();
      else if (state.view === "history") body = renderHistory();
      else if (state.view === "historyDetail") body = renderHistoryDetail();
      else if (state.view === "profile") body = renderProfile();
      else if (state.view === "categoryDetail") body = renderCategoryDetail();
      else if (state.view === "workoutDetail") body = renderWorkoutDetail();
      else if (state.view === "presetAdmin") body = renderPresetAdmin();
      else if (state.view === "benessere") body = renderBenessere();
      else if (state.view === "library") body = renderLibrary();
      else if (state.view === "libraryDetail") body = renderLibraryDetail();
      else if (state.view === "libraryForm") body = renderLibraryForm();
      else if (state.view === "planMessagesAdmin") body = renderPlanMessagesAdmin();
      else body = renderHome();
    } catch (renderErr) {
      console.error("[My Dojo] errore imprevisto nel disegnare la schermata:", renderErr);
      state.view = "home";
      showNav = false;
      body = '<div class="empty">Si è verificato un errore imprevisto in questa schermata.</div>' +
        '<button class="btn btn-cta" data-action="go-home" style="margin-top:12px;">Torna alla home</button>';
    }

    var pillScrollPositions = Array.prototype.map.call(app.querySelectorAll(".pill-row"), function (el) { return el.scrollLeft; });
    var viewChanged = lastRenderedView !== null && lastRenderedView !== state.view;
    if (viewChanged) viewScrollMemory[lastRenderedView] = window.scrollY;

    var focusedSearch = null;
    var activeEl = document.activeElement;
    if (activeEl && activeEl.id === "live-search-input") {
      focusedSearch = { start: activeEl.selectionStart, end: activeEl.selectionEnd };
    }

    app.innerHTML =
      busyBar() +
      (showNav ? renderScreenHeader(tabTitles[state.view], state.view) : "") +
      '<main class="screen">' +
        (state.flashMessage ? '<div class="flash-msg">✓ ' + escapeHtml(state.flashMessage) + '</div>' : "") +
        (state.authError ? '<div class="error-msg">' + escapeHtml(state.authError) + '</div>' : "") +
        body +
      '</main>' +
      (showNav ? renderBottomNav() : "");

    Array.prototype.forEach.call(app.querySelectorAll(".pill-row"), function (el, i) {
      if (pillScrollPositions[i] != null) el.scrollLeft = pillScrollPositions[i];
    });

    if (focusedSearch) {
      var newSearchEl = document.getElementById("live-search-input");
      if (newSearchEl) {
        newSearchEl.focus();
        newSearchEl.setSelectionRange(focusedSearch.start, focusedSearch.end);
      }
    }

    if (viewChanged) window.scrollTo(0, viewScrollMemory[state.view] || 0);
    lastRenderedView = state.view;

    if (state.view === "workout" && state.activeSession) {
      startWorkoutTimer(state.activeSession.started_at);
      if (isCircuitSession()) startCircuitTimer();
    }

    ensureVideosPlay();
    ensureLazyThumbs();
  }

  function handleVideoError(e) {
    var v = e.target;
    var codes = { 1: "richiesta interrotta", 2: "errore di rete", 3: "errore di decodifica", 4: "formato non supportato dal browser" };
    var code = v.error ? v.error.code : null;
    var msg = "Video non disponibile" + (code ? " (" + (codes[code] || ("errore " + code)) + ")" : "");
    var fallback = document.createElement("div");
    fallback.className = "info-msg";
    fallback.style.textAlign = "center";
    fallback.textContent = msg;
    if (v.parentNode) v.parentNode.replaceChild(fallback, v);
  }

  function ensureVideosPlay() {
    var videos = app.querySelectorAll("video");
    for (var i = 0; i < videos.length; i++) {
      var v = videos[i];
      v.muted = true;
      v.addEventListener("error", handleVideoError);
      v.addEventListener("loadedmetadata", function () {
        if (this.videoWidth && this.videoHeight) {
          var sizeTarget = this.parentNode && this.parentNode.classList.contains("exlib-detail-video-wrap") ? this.parentNode : this;
          sizeTarget.style.aspectRatio = this.videoWidth + " / " + this.videoHeight;
        }
        if (!this.hasAttribute("autoplay")) this.currentTime = 0.05;
      });
      if (!v.hasAttribute("autoplay")) continue;
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    }
  }

  function ensureLazyThumbs() {
    var thumbs = app.querySelectorAll("video[data-src]");
    if (thumbs.length === 0) return;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var v = entry.target;
        v.src = v.getAttribute("data-src");
        v.removeAttribute("data-src");
        v.load();
        observer.unobserve(v);
      });
    }, { rootMargin: "200px" });
    for (var i = 0; i < thumbs.length; i++) observer.observe(thumbs[i]);
  }

  function displayName() {
    var email = (state.user && state.user.email) || "";
    var local = email.split("@")[0] || "";
    var firstName = local.split(/[.\-_0-9]+/)[0] || local;
    if (!firstName) return "";
    return firstName.charAt(0).toUpperCase() + firstName.slice(1);

      '</main>';
  }

  function currentWeekdayIndex() {
    var jsDay = new Date().getDay();
    return (jsDay + 6) % 7;
  }

  function startOfWeek() {
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - currentWeekdayIndex());
    start.setHours(0, 0, 0, 0);
    return start;
  }

  function isDayCompleted(templateId) {
    if (!templateId) return false;
    var weekStart = startOfWeek();
    var weekEnd = new Date(weekStart.getTime() + 7 * 24 * 3600 * 1000);
    return state.history.some(function (s) {
      if (s.template_id !== templateId || !s.finished_at) return false;
      var d = new Date(s.finished_at);
      return d >= weekStart && d < weekEnd;
    });
  }

  function isSameDay(d1, d2) {
    return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
  }

  function hasTrainedOnDate(date) {
    return state.history.some(function (s) {
      return s.finished_at && isSameDay(new Date(s.finished_at), date);
    });
  }

  function hasTrainedToday() {
    return hasTrainedOnDate(new Date());
  }

  function computeStreak() {
    var cursor = new Date();
    if (!hasTrainedOnDate(cursor)) {
      cursor.setDate(cursor.getDate() - 1);
      if (!hasTrainedOnDate(cursor)) return 0;
    }
    var streak = 0;
    while (hasTrainedOnDate(cursor)) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function dayOfYear(d) {
    var start = new Date(d.getFullYear(), 0, 0);
    return Math.floor((d - start) / 86400000);
  }

  function pickDailyMessage(list) {
    if (!list || list.length === 0) return null;
    var idx = dayOfYear(new Date()) % list.length;
    return list[idx].text;
  }

  function renderPlanTopCard(compact) {
    var trainedToday = hasTrainedToday();
    var streak = computeStreak();
    var activeMessages = state.dashboardMessages.filter(function (m) { return m.active; });
    var pool = activeMessages.filter(function (m) { return m.kind === (trainedToday ? "greeting_done" : "greeting_pending"); });
    var greeting = pickDailyMessage(pool) || (trainedToday ? "Allenamento di oggi fatto! Sei un vero guerriero 🎉" : "Pronto per allenarti oggi?");
    greeting = greeting.replace(/\{streak\}/g, streak);
    var tip = pickDailyMessage(activeMessages.filter(function (m) { return m.kind === "tip"; }));
    var season = getCurrentSeason();
    var lvl = computeLevel(countSessionsInRange(season.start, season.end));
    var best = getBestSeasonLevel(lvl);

    var metaBits = [];
    metaBits.push(season.label);
    metaBits.push(lvl.isMaxLevel ? "Livello massimo 🏆" : lvl.sessionsToNext + " al Liv. " + (lvl.level + 1));
    if (streak > 0) metaBits.push("🔥 " + streak + " giorni di fila");

    return '<div class="greeting-card">' +
      mascotBadge(MASCOT_HEAD, compact ? 60 : 76) +
      '<div class="greeting-text">' +
        '<p class="greeting-msg">' + escapeHtml(greeting) + '</p>' +
        '<div class="greeting-level-row">' +
          '<span class="level-badge">Liv. ' + lvl.level + '</span>' +
          '<span class="level-title-inline">' + escapeHtml(lvl.title) + '</span>' +
        '</div>' +
        (lvl.isMaxLevel ? '' : '<div class="level-progress-bar"><div class="level-progress-fill" style="width:' + lvl.progressPct + '%;"></div></div>') +
        '<p class="greeting-meta">' + metaBits.join(" · ") + '</p>' +
        (best.level > lvl.level ? '<p class="greeting-meta">🏆 Record: Liv. ' + best.level + ' · ' + escapeHtml(best.title) + '</p>' : "") +
        (tip ? '<p class="greeting-tip-inline">💡 ' + escapeHtml(tip) + '</p>' : "") +
      '</div>' +
    '</div>';
  }

  function shouldShowSeasonRecap() {
    var current = getCurrentSeason();
    var seen = null;
    try { seen = localStorage.getItem("mydojo-season-seen"); } catch (e) {}
    if (seen === current.key) return false;
    return getPastSeasons().length > 0;
  }

  function renderSeasonRecap() {
    var past = getPastSeasons();
    var lastSeason = past[0];
    var current = getCurrentSeason();
    return '<div class="card season-recap-card">' +
      '<button class="season-recap-close" data-action="dismiss-season-recap">&times;</button>' +
      '<p class="season-recap-msg">🏁 <strong>' + escapeHtml(lastSeason.label) + '</strong> conclusa: hai raggiunto il Livello ' + lastSeason.levelInfo.level + ' — ' + escapeHtml(lastSeason.levelInfo.title) + '!</p>' +
      '<p class="season-recap-msg2">Si riparte da zero per ' + escapeHtml(current.label) + ' 🎉</p>' +
    '</div>';
  }

  function dismissSeasonRecap() {
    try { localStorage.setItem("mydojo-season-seen", getCurrentSeason().key); } catch (e) {}
    render();
  }

  function renderPlan() {
    var todayIdx = currentWeekdayIndex();

    var assignedCount = 0, completedCount = 0, missedDay = null;
    var dayEntries = WEEKDAY_NAMES.map(function (name, idx) {
      var assignment = state.weeklyPlan.filter(function (p) { return p.weekday === idx; })[0];
      var tpl = assignment && assignment.template_id ? state.templates.filter(function (t) { return t.id === assignment.template_id; })[0] : null;
      var done = tpl ? isDayCompleted(tpl.id) : false;
      if (tpl) {
        assignedCount++;
        if (done) completedCount++;
        else if (idx < todayIdx && !missedDay) missedDay = { name: name, tpl: tpl };
      }
      return { name: name, idx: idx, tpl: tpl, done: done };
    });

    var actionCard = "";
    if (state.activeSession) {
      actionCard = '<div class="plan-action-card live" style="background:' + gradientFor(state.activeSession.template_id || state.activeSession.id) + ';" data-action="resume-session">' +
        '<span class="tag tag-solid">🏋️ In corso</span>' +
        '<p class="action-title">' + escapeHtml(state.activeSession.template_name) + '</p>' +
        '<p class="action-meta">Iniziato il ' + formatDate(state.activeSession.started_at) + ' — tocca per riprendere</p>' +
      '</div>';
    } else if (missedDay) {
      actionCard = '<div class="plan-action-card" style="background:' + gradientFor(missedDay.tpl.id) + ';" data-action="start-session" data-id="' + missedDay.tpl.id + '">' +
        '<span class="tag tag-solid">⏱️ Recupero</span>' +
        '<p class="action-title">' + escapeHtml(missedDay.tpl.name) + '</p>' +
        '<p class="action-meta">Saltato ' + missedDay.name + ' — tocca per recuperarlo</p>' +
      '</div>';
    }

    var html = shouldShowSeasonRecap() ? renderSeasonRecap() : "";
    html += actionCard
      ? '<div class="plan-top-row">' + renderPlanTopCard(true) + actionCard + '</div>'
      : renderPlanTopCard(false);

    html += '<p class="page-sub" style="margin-top:2px;">' +
      (assignedCount > 0 ? completedCount + ' di ' + assignedCount + ' allenamenti fatti questa settimana' : 'La tua settimana tipo') +
    '</p>';

    dayEntries.forEach(function (d) {
      var isToday = d.idx === todayIdx;
      var clickable = d.tpl && !state.activeSession;
      html += '<div class="plan-day' + (isToday ? " today" : "") + (clickable ? " clickable" : "") + '"' +
        (clickable ? ' data-action="start-session" data-id="' + d.tpl.id + '"' : '') + '>' +
        (d.tpl && d.tpl.image_url ? '<img class="plan-day-banner goal" src="' + escapeHtml(d.tpl.image_url) + '" alt="" loading="lazy">' : '') +
        (!d.tpl ? '<img class="plan-day-banner rest" src="Banner/Riposo.jpg" alt="" loading="lazy">' : '') +
        (d.done ? '<span class="plan-day-check">✓</span>' : '') +
        '<button class="plan-day-edit" data-action="edit-plan-day" data-weekday="' + d.idx + '" title="Cambia obiettivo">✏️</button>' +
        '<div class="plan-day-info">' +
          '<span class="plan-day-name">' + d.name + (isToday ? ' <span class="tag tag-solid" style="font-size:10px;">Oggi</span>' : '') + '</span>' +
          '<span class="plan-day-workout">' + (d.tpl ? escapeHtml(d.tpl.name) : "Riposo") + '</span>' +
        '</div>' +
      '</div>';
    });

    return html;
  }

  // Ogni obiettivo del catalogo appare una sola volta: se lo hai già personalizzato,
  // mostro quello (col nome che gli hai dato); altrimenti mostro il "Base" del catalogo,
  // che verrà personalizzato in automatico al salvataggio se lo assegni a un giorno.
  function buildGoalOptions() {
    var personalByPreset = {};
    state.templates.forEach(function (t) { if (t.source_preset_id) personalByPreset[t.source_preset_id] = t; });
    var options = state.templates
      .filter(function (t) { return !t.source_preset_id; })
      .map(function (t) { return { value: "t:" + t.id, name: t.name }; });
    state.presets.forEach(function (p) {
      var personal = personalByPreset[p.id];
      options.push(personal ? { value: "t:" + personal.id, name: personal.name } : { value: "p:" + p.id, name: p.name + " (Base)" });
    });
    return options;
  }

  function renderPlanEditDay() {
    var idx = state.planEditWeekday;
    var html = '<button class="back-btn" data-action="plan-cancel-edit">←</button>';
    html += '<h1 class="page-title">' + WEEKDAY_NAMES[idx] + '</h1><p class="page-sub">Assegna un obiettivo a questo giorno, oppure lascialo come giorno di riposo.</p>';

    var options = buildGoalOptions();
    if (options.length === 0) {
      html += '<div class="empty">Non hai ancora nessun obiettivo da assegnare.<br>Creane uno prima nel tab "Corpo".</div>';
      return html;
    }

    var assignment = state.weeklyPlan.filter(function (p) { return p.weekday === idx; })[0];
    var currentValue = assignment && assignment.template_id ? "t:" + assignment.template_id : "";

    html += '<form data-action="save-plan-day">' +
      '<select name="goal">' +
        '<option value="">Riposo (nessun obiettivo)</option>' +
        options.map(function (o) {
          return '<option value="' + o.value + '" ' + (currentValue === o.value ? "selected" : "") + '>' + escapeHtml(o.name) + '</option>';
        }).join("") +
      '</select>' +

      '<span class="hero-icon">' + (icon || "🏋️") + '</span>' +
      '<p class="hero-title">' + escapeHtml(name) + '</p>' +

  function renderCategoryDetail() {
    var cat = state.currentCategory;
    var html = '<button class="back-btn" data-action="go-home">←</button>';
    html += '<h1 class="page-title">' + escapeHtml(cat) + '</h1>';

    var myItems = state.templates.filter(function (t) { return (t.category || CATEGORIES[0].key) === cat; });
    var allCatalogItems = state.presets.filter(function (p) { return (p.category || CATEGORIES[0].key) === cat; });
    var allOrphanItems = myItems.filter(function (t) { return !t.source_preset_id; });

    if (myItems.length === 0 && allCatalogItems.length === 0) {
      html += '<div class="empty">Nessun obiettivo in questa categoria ancora.</div>';
      return html;
    }

    if (allCatalogItems.length + allOrphanItems.length > 4) {
      html += '<input type="search" id="live-search-input" data-live-search="category" placeholder="Cerca un obiettivo..." value="' + escapeHtml(state.categoryFilterText) + '" style="margin-bottom:10px;">';
    }

    var q = (state.categoryFilterText || "").trim().toLowerCase();
    var catalogItems = q ? allCatalogItems.filter(function (p) { return p.name.toLowerCase().indexOf(q) !== -1; }) : allCatalogItems;
    var orphanItems = q ? allOrphanItems.filter(function (t) { return t.name.toLowerCase().indexOf(q) !== -1; }) : allOrphanItems;

    if (catalogItems.length > 0) {
      html += '<h3 class="section-title" style="margin-top:6px;">Obiettivi pronti</h3>';
      catalogItems.forEach(function (p) {
        html += workoutCard(p.name, "preset", p.id, state.favoriteIds.indexOf(p.id) !== -1, p.image_url, p.icon);
      });
    }
    if (orphanItems.length > 0) {
      html += '<h3 class="section-title">I tuoi obiettivi personalizzati</h3>';
      orphanItems.forEach(function (t) { html += workoutCard(t.name, "template", t.id, false, t.image_url); });
    }
    if (q && catalogItems.length === 0 && orphanItems.length === 0) {
      html += '<div class="empty">Nessun obiettivo trovato per "' + escapeHtml(state.categoryFilterText) + '".</div>';
    }

    return html;

  function renderWorkoutDetail() {
    var w = state.currentWorkout;

    var mode = hasLinkedPersonal ? state.workoutViewMode : "preset";
    var viewData = (hasLinkedPersonal && mode === "personal") ? w.linkedPersonal : w.data;
    var exs = (hasLinkedPersonal && mode === "personal") ? state.currentWorkoutPersonalExercises : state.currentWorkoutExercises;

    var html = '<button class="back-btn" data-action="open-category" data-id="' + escapeHtml(state.currentCategory) + '">←</button>';

    html += w.data.image_url
      ? '<div class="workout-hero has-img"><img class="workout-hero-img" src="' + escapeHtml(w.data.image_url) + '" alt="' + escapeHtml(w.data.name) + '"></div>'
      : '<div class="workout-hero">' + (w.data.icon || "🏋️") + '</div>';
    if (isPreset) {
      var isFav = state.favoriteIds.indexOf(w.data.id) !== -1;
      html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;">' +
        '<h1 class="page-title" style="margin:0;">' + escapeHtml(viewData.name) + '</h1>' +
        '<button class="btn btn-ghost btn-small" data-action="toggle-favorite" data-id="' + w.data.id + '" style="flex-shrink:0;">' + (isFav ? "❤️" : "🤍") + '</button>' +
      '</div>';
      if (w.data.description) html += '<p class="page-sub">' + escapeHtml(w.data.description) + '</p>';
    } else {
      html += '<h1 class="page-title" style="margin-top:10px;">' + escapeHtml(viewData.name) + '</h1>';
    }

    if (hasLinkedPersonal) {
      html += '<div class="view-mode-toggle">' +
        '<button class="view-mode-btn' + (mode === "personal" ? " active" : "") + '" data-action="set-workout-view-mode" data-value="personal">Personalizzato</button>' +
        '<button class="view-mode-btn' + (mode === "preset" ? " active" : "") + '" data-action="set-workout-view-mode" data-value="preset">Base</button>' +
      '</div>';
    }

    if (isCircuit) {
      var rest = restSecondsFor(viewData);
      var totalSeconds = exs.reduce(function (sum, ex) { return sum + ex.duration_seconds; }, 0) + Math.max(0, exs.length - 1) * rest;
      html += '<div class="stats-row">' +
        '<div class="stat-tile"><span class="num">' + exs.length + '</span><span class="lbl">Esercizi</span></div>' +
        '<div class="stat-tile"><span class="num">' + formatDuration(totalSeconds) + '</span><span class="lbl">Durata</span></div>' +
      '</div>';

      html += '<div class="card" style="margin-top:4px;">' +
        '<div class="toggle-row"><div><p class="toggle-label">Inizia con il riscaldamento</p><p class="toggle-sub">Aggiunge 3 esercizi di riscaldamento prima di iniziare</p></div>' +
          '<button class="toggle-switch' + (state.workoutStartOptions.warmup ? " on" : "") + '" data-action="toggle-warmup"></button></div>' +
        '<div class="toggle-row"><div><p class="toggle-label">Allenamento silenzioso</p><p class="toggle-sub">Evita i salti nel riscaldamento</p></div>' +
          '<button class="toggle-switch' + (state.workoutStartOptions.silent ? " on" : "") + '" data-action="toggle-silent"></button></div>' +
      '</div>';
    } else {
      html += '<div class="stats-row"><div class="stat-tile"><span class="num">' + exs.length + '</span><span class="lbl">Esercizi</span></div></div>';
    }

    html += '<h3 class="section-title">Lista di Esercizi</h3>';
    if (exs.length === 0) {
      html += '<div class="empty">Nessun esercizio ancora in questo obiettivo.</div>';
    } else {
      exs.forEach(function (ex, i) {
        html += '<div class="exercise-row">' +
          '<span class="name">' + (i + 1) + '. ' + escapeHtml(ex.name) + '</span>' +
          (ex.duration_seconds ? '<span class="tag" style="background:var(--surface-2);color:var(--text-dim);">' + ex.duration_seconds + 's</span>' : '') +
        '</div>';
      });
    }

    if (w.kind === "template") {
      html += '<button class="btn btn-ghost" data-action="edit-workout-template" data-id="' + w.data.id + '" style="margin-top:14px;">✏️ Personalizza esercizi</button>';
    } else if (hasLinkedPersonal) {
      html += '<button class="btn btn-ghost" data-action="edit-workout-template" data-id="' + w.linkedPersonal.id + '" style="margin-top:14px;">✏️ Personalizza esercizi</button>';
      if (isAdmin()) {
        html += '<button class="btn btn-ghost" data-action="open-preset-admin" data-id="' + w.data.id + '" style="margin-top:8px;">🛠️ Modifica nel catalogo (admin)</button>';
      }
    } else {
      html += '<button class="btn btn-ghost" data-action="personalize-workout" style="margin-top:14px;">✏️ Personalizza</button>';
      if (isAdmin()) {
        html += '<button class="btn btn-ghost" data-action="open-preset-admin" data-id="' + w.data.id + '" style="margin-top:8px;">🛠️ Modifica nel catalogo (admin)</button>';
      }
    }

    html += '<div style="height:70px;"></div>';
    html += '<div class="fixed-cta"><button class="btn btn-cta" data-action="start-workout" ' + ((state.activeSession || exs.length === 0) ? "disabled" : "") + '>Inizio</button></div>';
    return html;
  }

  var PLAN_MESSAGE_KIND_LABELS = {

      '<label>Tipo</label>' +
      '<select name="kind">' +

      '</select>' +

      '<textarea name="text" rows="2" required>' + escapeHtml(p.text || "") + '</textarea>' +

      '<button class="btn btn-accent" type="submit" style="margin-top:10px;">' + (p.id ? "Salva modifiche" : "Aggiungi messaggio") + '</button>' +
    '</form>';

      html += '<h3 class="section-title">' + PLAN_MESSAGE_KIND_LABELS[kind] + '</h3>';

  }

  function equipmentIcon(eq) {
    return EQUIPMENT_ICONS[eq] || "💪";

  function renderLibrary() {
    var html;
    if (state.libraryPickMode === "preset") {
      html = '<button class="back-btn" data-action="open-preset-admin" data-id="' + state.currentPresetAdmin.id + '">←</button>';

      html = '<button class="back-btn" data-action="open-template" data-id="' + state.currentTemplate.id + '">←</button>';

      html = '<button class="back-btn" data-action="go-home">←</button>';
    }
    html += '<h1 class="page-title">Libreria esercizi</h1>';
    html += '<p class="page-sub">' + (state.libraryPickMode ? "Scegli un esercizio da aggiungere all'obiettivo" : "Come si fanno e quali muscoli coinvolgono") + '</p>';

    html += '<input type="search" id="live-search-input" data-live-search="library" placeholder="Cerca un esercizio..." value="' + escapeHtml(state.libraryFilterText) + '" style="margin-bottom:10px;">';

    html += '<div class="pill-row">' +
      pillButton("Tutti i muscoli", "filter-muscle", "", !state.libraryFilterMuscle) +

    '</div>';
    html += '<div class="pill-row">' +
      pillButton("Tutti gli attrezzi", "filter-equipment", "", !state.libraryFilterEquipment) +
      EQUIPMENT_TYPES.map(function (eq) { return pillButton(eq, "filter-equipment", eq, state.libraryFilterEquipment === eq); }).join("") +
    '</div>';

    var list = state.libraryExercises.filter(function (ex) {
      if (state.libraryFilterMuscle) {
        var matchesPrimary = ex.muscle_primary === state.libraryFilterMuscle;
        var matchesSecondary = (ex.muscles_secondary || []).indexOf(state.libraryFilterMuscle) !== -1;
        if (!matchesPrimary && !matchesSecondary) return false;
      }
      if (state.libraryFilterEquipment && ex.equipment !== state.libraryFilterEquipment) return false;
      if (state.libraryFilterText && ex.name.toLowerCase().indexOf(state.libraryFilterText.trim().toLowerCase()) === -1) return false;
      return true;
    });

    if (list.length === 0) {
      html += '<div class="empty">Nessun esercizio trovato con questi filtri.</div>';

      html += '<div class="exlib-grid">';
      list.forEach(function (ex) {
        var action = state.libraryPickMode ? "pick-library-exercise" : "open-library-detail";
        var thumb = isVideoUrl(ex.image_url)
          ? '<video class="exlib-card-thumb" data-src="' + escapeHtml(ex.image_url) + '" muted playsinline preload="none"></video>'

          '<div class="exlib-thumb">' + thumb + '</div>' +
          '<div class="exlib-card-body">' +
            '<span class="exlib-name">' + escapeHtml(ex.name) + '</span>' +
            '<span class="exlib-muscle">' + escapeHtml(ex.muscle_primary) + '</span>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }

    return html;
  }

  function muscleRow(muscle, primary) {
    var filled = primary ? 5 : 3;

    return '<div class="muscle-row"><span>' + escapeHtml(muscle) +
      (primary ? ' <span class="tag tag-solid" style="font-size:10px;">Primario</span>' : '') +
      '</span><span class="muscle-dots">' + dots + '</span></div>';
  }

  function findExerciseMedia(ex) {
    if (!ex) return null;
    var match = null;
    if (ex.library_exercise_id) {

    }
    if (!match) {
      var name = (ex.name || "").trim().toLowerCase();
      match = state.libraryExercises.filter(function (le) { return le.name.trim().toLowerCase() === name; })[0];

    return match && isVideoUrl(match.image_url) ? match.image_url : null;

  function renderCircuitPlayer() {
    var c = state.circuit;
    var exs = state.sessionExercises;
    var current = exs[c.index];
    var isRest = c.phase === "rest";
    var nextEx = exs[c.index + 1];
    var totalForPhase = isRest ? restSecondsFor(state.activeSession) : current.duration_seconds;
    var pct = Math.max(0, Math.min(100, Math.round((c.secondsLeft / totalForPhase) * 100)));
    var videoUrl = !isRest ? findExerciseMedia(current) : null;
    var circumference = 2 * Math.PI * 28;
    var ringOffset = circumference * (1 - pct / 100);

    var html = '<div class="circuit-top-row">' +
      '<button class="back-btn" data-action="go-home">←</button>' +
      '<div class="circuit-ring-wrap">' +
        '<svg viewBox="0 0 64 64" class="circuit-ring">' +
          '<circle class="circuit-ring-track" cx="32" cy="32" r="28"></circle>' +
          '<circle class="circuit-ring-fill' + (isRest ? " rest" : "") + '" id="circuit-ring-fill" cx="32" cy="32" r="28" stroke-dasharray="' + circumference.toFixed(2) + '" stroke-dashoffset="' + ringOffset.toFixed(2) + '"></circle>' +
        '</svg>' +
        '<span class="circuit-ring-number" id="circuit-seconds">' + c.secondsLeft + '</span>' +
      '</div>' +
    '</div>';
    html += '<p class="circuit-progress">Esercizio ' + (c.index + 1) + ' di ' + exs.length + '</p>';
    html += '<div class="circuit-phase-tag ' + (isRest ? "rest" : "work") + '">' + (isRest ? "RIPOSO" : "IN CORSO") + '</div>';
    html += '<h2 class="circuit-exname">' + escapeHtml(isRest ? (nextEx ? "Prossimo: " + nextEx.name : "Ultimo esercizio") : current.name) + '</h2>';

    if (videoUrl) {
      html += '<div class="exlib-detail-video-wrap"><video class="exlib-detail-video" src="' + escapeHtml(videoUrl) + '" autoplay muted loop playsinline preload="auto"></video></div>';
    }

    if (!isRest && current.instructions) {
      html += '<div class="card" style="margin-top:10px;">' +
        '<p class="section-title" style="margin-top:0;margin-bottom:6px;font-size:13px;font-weight:700;">Come si fa</p>' +
        '<p style="margin:0;line-height:1.5;">' + escapeHtml(current.instructions) + '</p>' +

    html += '<div class="fixed-cta">' +
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" data-action="circuit-pause">' + (c.paused ? "▶ Riprendi" : "⏸ Pausa") + '</button>' +
        '<button class="btn btn-accent" data-action="circuit-skip">Salta ⏭</button>' +
      '</div>' +

    '</div>';

    return html;

  function renderHeatmap() {
    var weeksCount = 12;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var dow = (today.getDay() + 6) % 7; // 0 = lunedì
    var startMonday = new Date(today);
    startMonday.setDate(today.getDate() - dow - (weeksCount - 1) * 7);

    var trainedDays = {};
    state.history.forEach(function (s) {
      var d = new Date(s.started_at);
      d.setHours(0, 0, 0, 0);
      trainedDays[dateKey(d)] = true;
    });

    var html = '<div class="heatmap-grid">';
    for (var col = 0; col < weeksCount; col++) {
      html += '<div class="heatmap-col">';
      for (var row = 0; row < 7; row++) {
        var d = new Date(startMonday);
        d.setDate(startMonday.getDate() + col * 7 + row);
        if (d > today) {
          html += '<div class="heatmap-cell future"></div>';
        } else {
          var trained = !!trainedDays[dateKey(d)];
          html += '<div class="heatmap-cell' + (trained ? ' trained' : '') + '" title="' +
            d.toLocaleDateString("it-IT") + (trained ? " — allenamento" : "") + '"></div>';
        }
      }
      html += '</div>';
    }
    html += '</div>';
    html += '<p style="font-size:11px;color:var(--text-dim);margin:8px 0 0;">Ultime ' + weeksCount + ' settimane</p>';
    return '<div class="card">' + html + '</div>';
  }

  function renderMoodSparkline() {
    var entries = state.moodEntries.slice(0, 14).slice().reverse();
    if (entries.length < 2) return "";
    var w = 280, h = 44, pad = 6;
    var step = (w - pad * 2) / (entries.length - 1);
    var points = entries.map(function (e, i) {
      var x = pad + i * step;
      var y = pad + (h - pad * 2) * (1 - (e.mood - 1) / 4);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    var dots = entries.map(function (e, i) {
      var x = pad + i * step;
      var y = pad + (h - pad * 2) * (1 - (e.mood - 1) / 4);
      return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.6" fill="#f1a39f"></circle>';
    }).join("");
    return '<svg class="mood-sparkline" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polyline points="' + points.join(" ") + '" fill="none" stroke="#f1a39f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
      dots +
    '</svg>';
  }

  function handleSubmitAuth(form) {
    var email = form.email.value.trim();
    var password = form.password.value;
    withBusy(function () {
      state.authError = "";
      var call = state.authMode === "login"
        ? sb.auth.signInWithPassword({ email: email, password: password })
        : sb.auth.signUp({ email: email, password: password, options: { emailRedirectTo: window.location.origin + window.location.pathname } });
      return call.then(function (res) {
        if (res.error) { state.authError = res.error.message; return; }
        if (state.authMode === "signup" && res.data && res.data.user && !res.data.session) {
          state.authError = "Controlla la tua email per confermare l'account (il messaggio arriva da Supabase, il servizio che gestisce gli account di questa app — non è spam), poi accedi.";
          state.authMode = "login";
          return;
        }
        if (res.data && res.data.session) {
          console.log("[My Dojo] login riuscito, carico i dati direttamente");
          booted = true;
          state.user = res.data.user;
          return loadPlanData();
        }
      });
    });

  function stopBreathingTimer() {
    if (breathingTimerHandle) { clearInterval(breathingTimerHandle); breathingTimerHandle = null; }
  }

  function applyBreathCircleTransform(phase) {
    var circle = document.getElementById("breath-circle");
    if (!circle) return;
    if (phase.key === "in") {
      circle.style.transition = "transform " + phase.secs + "s ease-in-out";
      circle.style.transform = "scale(1.15)";
    } else if (phase.key === "out") {
      circle.style.transition = "transform " + phase.secs + "s ease-in-out";
      circle.style.transform = "scale(0.62)";
    }
  }

  function startBreathing(techniqueKey) {
    if (!BREATH_TECHNIQUES[techniqueKey]) return;
    stopBreathingTimer();
    var phases = BREATH_TECHNIQUES[techniqueKey].phases;
    state.breathing = { technique: techniqueKey, phaseIndex: 0, secondsLeft: phases[0].secs, cycles: 0 };
    render();
    var circle = document.getElementById("breath-circle");
    if (circle) {
      circle.style.transition = "none";
      circle.style.transform = "scale(0.62)";
      void circle.offsetWidth; // forza il browser a "fissare" lo stato di partenza prima di animare
    }
    requestAnimationFrame(function () { applyBreathCircleTransform(phases[0]); });
    breathingTimerHandle = setInterval(tickBreathing, 1000);
  }

  function stopBreathing() {
    stopBreathingTimer();
    state.breathing = null;
    render();
  }

  function advanceBreathPhase() {
    var b = state.breathing;
    var phases = BREATH_TECHNIQUES[b.technique].phases;
    b.phaseIndex += 1;
    if (b.phaseIndex >= phases.length) {
      b.phaseIndex = 0;
      b.cycles += 1;
    }
    var phase = phases[b.phaseIndex];
    b.secondsLeft = phase.secs;
    beep(phase.key === "in" ? 520 : phase.key === "out" ? 400 : 460, 90);
    vibrate(60);
    var phaseEl = document.getElementById("breath-phase");
    var secEl = document.getElementById("breath-seconds");
    var cyclesEl = document.getElementById("breath-cycles");
    if (phaseEl) phaseEl.textContent = phase.name;
    if (secEl) secEl.textContent = b.secondsLeft;
    if (cyclesEl) cyclesEl.textContent = b.cycles;
    applyBreathCircleTransform(phase);
  }

  function tickBreathing() {
    var b = state.breathing;
    var secEl = document.getElementById("breath-seconds");
    if (!b || !secEl) { stopBreathingTimer(); return; }
    b.secondsLeft -= 1;
    if (b.secondsLeft <= 0) advanceBreathPhase();
    else secEl.textContent = b.secondsLeft;
  }

  function stopMeditationTimer() {
    if (meditationTimerHandle) { clearInterval(meditationTimerHandle); meditationTimerHandle = null; }
  }

  function startMeditation(minutes) {
    if (MEDITATION_DURATIONS.indexOf(minutes) === -1) return;
    stopMeditationTimer();
    var total = minutes * 60;
    var intervalSecs = Math.max(4, Math.floor(total / MEDITATION_LINES.length));
    state.meditation = { secondsLeft: total, lineIndex: 0, nextLineAt: total - intervalSecs, intervalSecs: intervalSecs, done: false };
    render();
    meditationTimerHandle = setInterval(tickMeditation, 1000);
  }

  function stopMeditation() {
    stopMeditationTimer();
    state.meditation = null;
    render();
  }

  function completeMeditation() {
    stopMeditationTimer();
    state.meditation.done = true;
    beep(440, 400);
    vibrate([120, 60, 120]);
    render();
  }

  function tickMeditation() {
    var m = state.meditation;
    var timerEl = document.getElementById("meditation-timer");
    if (!m || m.done || !timerEl) { stopMeditationTimer(); return; }
    m.secondsLeft -= 1;
    if (m.secondsLeft <= 0) { completeMeditation(); return; }
    timerEl.textContent = formatMeditationTime(m.secondsLeft);
    if (m.secondsLeft <= m.nextLineAt && m.lineIndex < MEDITATION_LINES.length - 1) {
      m.lineIndex += 1;
      m.nextLineAt -= m.intervalSecs;
      var lineEl = document.getElementById("meditation-line");
      if (lineEl) {
        lineEl.textContent = MEDITATION_LINES[m.lineIndex];
        lineEl.style.animation = "none";
        void lineEl.offsetWidth;
        lineEl.style.animation = "";
      }
    }
  }

      var a = list[idx], b = list[swapIdx];
      return Promise.all([
        sb.from("preset_template_exercises").update({ order_index: b.order_index }).eq("id", a.id).select().single(),
        sb.from("preset_template_exercises").update({ order_index: a.order_index }).eq("id", b.id).select().single()

        var rows = exercises.map(function (ex, i) {

            template_id: newTplId,

            instructions: ex.instructions,
            duration_seconds: ex.duration_seconds,
            library_exercise_id: ex.library_exercise_id || null,
            order_index: i
          };
        });
        return sb.from("template_exercises").insert(rows).select().then(function (res2) {
          if (res2.error) throw res2.error;
          return loadTemplates().then(function () {
            return { id: newTplId, name: preset.name, category: category, rest_seconds: res.data.rest_seconds, source_preset_id: preset.id, image_url: res.data.image_url, exercises: res2.data };

      if (w.linkedPersonal) {
        var usePersonal = state.workoutViewMode === "personal";
        var exs = usePersonal ? state.currentWorkoutPersonalExercises : state.currentWorkoutExercises;

    var form = e.target.closest("form[data-action]");
    if (!form) return;
    e.preventDefault();
    var action = form.getAttribute("data-action");
    if (action === "submit-auth") handleSubmitAuth(form);
    else if (action === "save-library-exercise") saveLibraryExercise(form);
    else if (action === "save-plan-day") savePlanDay(form);
    else if (action === "save-preset-admin") savePresetAdmin(form.name.value.trim(), form.description.value.trim(), form.category.value, form.icon.value.trim());
    else if (action === "save-plan-message") savePlanMessage(form.kind.value, form.text.value.trim(), form.active.checked);
    else if (action === "save-mood") {
      var moodVal = parseInt(form.mood.value, 10);
      if (!isNaN(moodVal)) saveMood(moodVal, form.note.value.trim());
    }
    else if (action === "add-preset-exercise") {
      var peName = form.exname.value.trim();
      var peInstr = form.exinstructions.value.trim();
      var peDuration = parseInt(form.exduration.value, 10);
      if (peName && !isNaN(peDuration)) { addPresetExercise(peName, peInstr, peDuration); form.reset(); form.exduration.value = "30"; }
    }
  });

    else if (action === "stop-breathing") stopBreathing();
    else if (action === "start-meditation") startMeditation(parseInt(el.getAttribute("data-value"), 10));
    else if (action === "stop-meditation") stopMeditation();
    else if (action === "set-mood-value") {
      var moodVal2 = parseInt(el.getAttribute("data-value"), 10);
      state.moodDraft.mood = moodVal2;
      var row = el.parentElement;
      Array.prototype.forEach.call(row.children, function (btn) { btn.classList.remove("selected"); });
      el.classList.add("selected");
      var hiddenMood = document.querySelector('form[data-action="save-mood"] input[name="mood"]');
      if (hiddenMood) hiddenMood.value = moodVal2;
      var submitBtn = document.querySelector('form[data-action="save-mood"] button[type="submit"]');
      if (submitBtn) submitBtn.disabled = false;
    }
    else if (action === "move-exercise-up") moveTemplateExercise(id, "up");
    else if (action === "move-exercise-down") moveTemplateExercise(id, "down");
    else if (action === "move-preset-exercise-up") movePresetExercise(id, "up");
    else if (action === "move-preset-exercise-down") movePresetExercise(id, "down");
  });

  app.addEventListener("input", function (e) {
    var el = e.target.closest("[data-live-search]");
    if (!el) return;
    var scope = el.getAttribute("data-live-search");
    if (scope === "library") state.libraryFilterText = el.value;
    else if (scope === "category") state.categoryFilterText = el.value;
    render();
  });

  app.addEventListener("change", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    var seconds = parseInt(el.value, 10);
    if (isNaN(seconds) || seconds < 0) return;
    if (action === "update-exercise-duration") updateExerciseDuration(id, seconds);
    else if (action === "update-preset-exercise-duration") updatePresetExerciseDuration(id, seconds);
    else if (action === "update-template-rest") updateTemplateRest(seconds);
    else if (action === "update-preset-rest") updatePresetRest(seconds);
  });

  app.addEventListener("wheel", function (e) {
    var row = e.target.closest(".pill-row");
    if (!row) return;
    if (row.scrollWidth <= row.clientWidth) return;
    row.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });

  // ---------- boot ----------

  var booted = false;

  function handleAuthResolved(source, user) {
    console.log("[My Dojo] auth risolto da:", source, user ? "loggato" : "non loggato");
    if (!booted) {
      booted = true;
      state.user = user;
      if (user) goPlan();
      else { state.view = "auth"; render(); }
    } else {
      state.user = user;
      if (!user) { state.view = "auth"; render(); }
      else if (state.view === "auth" || state.view === "loading") { goPlan(); }
    }
  }

  sb.auth.onAuthStateChange(function (event, session) {
    handleAuthResolved("onAuthStateChange:" + event, session ? session.user : null);
  });

  sb.auth.getSession().then(function (res) {
    if (booted) return;
    handleAuthResolved("getSession", res.data.session ? res.data.session.user : null);
  }).catch(function (err) {
    console.warn("[My Dojo] getSession fallita:", err);
  });

  // rete di sicurezza finale: se dopo alcuni secondi non è successo nulla,
  // mostra la schermata di accesso invece di restare bloccati per sempre
  setTimeout(function () {
    if (booted) return;
    console.warn("[My Dojo] boot bloccato, mostro comunque la schermata di accesso");
    booted = true;
    state.view = "auth";
    state.authError = "Non sono riuscito a verificare l'accesso. Prova a entrare di nuovo.";
    render();
  }, 6000);
})();
</script>
</body>
</html>

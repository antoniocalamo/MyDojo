<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-2: #f4f6fa;
    --border: #e3e7ee;
    --text: #14161a;
    --text-dim: #6b7280;
    --accent: #2f6fed;
    --accent-ink: #ffffff;
    --cta: #7cc61a;
    --cta-ink: #16210a;
    --danger: #e5484d;
    --danger-bg: rgba(229,72,77,0.1);
    --ok: #16a34a;
    --radius-lg: 22px;
    --radius: 16px;
    --radius-sm: 12px;
  }
  html[data-theme="verde"] {
    --accent: #1a9c5e;
    --cta: #f5a623;
    --cta-ink: #241500;
  }
  html[data-theme="scuro"] {
    --bg: #0f1115;
    --surface: #1a1d24;
    --surface-2: #22262f;
    --border: #2c3038;
    --text: #f2f3f5;
    --text-dim: #9aa0ac;
    --accent: #5b93ff;
    --cta: #a3e635;
    --cta-ink: #16210a;
    --danger-bg: rgba(229,72,77,0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: 90px;
  }
  main.screen { padding: 20px 18px 24px; }
  h1.page-title {
    font-size: 28px;
    font-weight: 800;
    margin: 6px 0 4px;
    letter-spacing: -0.02em;
  }
  p.page-sub { color: var(--text-dim); margin: 0 0 20px; font-size: 14px; }

  .back-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 999px;
    font-size: 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 999px;
    padding: 15px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-cta { background: var(--cta); color: var(--cta-ink); }
  .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-small { width: auto; padding: 10px 16px; font-size: 13px; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .btn { width: auto; flex: 1; }
  .btn[disabled] { opacity: 0.5; cursor: default; }

  input, textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 12px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 5px; font-weight: 600; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-bottom: 14px;
  }

  .hero-card {
    border-radius: var(--radius-lg);
    padding: 22px;
    margin-bottom: 16px;
    color: #fff;
    position: relative;
    overflow: hidden;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    cursor: pointer;
  }
  .hero-card .hero-icon {
    position: absolute;
    right: -10px;
    top: -10px;
    font-size: 90px;
    opacity: 0.18;
    line-height: 1;
  }
  .hero-card .hero-title { font-size: 19px; font-weight: 800; margin: 0; text-shadow: 0 1px 6px rgba(0,0,0,0.25); }
  .hero-card .hero-meta { font-size: 13px; opacity: 0.92; margin: 2px 0 0; }
  .hero-card.live { box-shadow: 0 0 0 3px var(--cta); }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.25);
    color: #fff;
    backdrop-filter: blur(2px);
  }
  .tag-solid { background: var(--cta); color: var(--cta-ink); }

  .stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .stat-tile {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
  }
  .stat-tile .num { font-size: 22px; font-weight: 800; display: block; }
  .stat-tile .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }

  .empty { text-align: center; color: var(--text-dim); padding: 40px 16px; font-size: 14px; }
  .error-msg, .info-msg {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin-bottom: 12px;
  }
  .error-msg { background: var(--danger-bg); color: var(--danger); }
  .info-msg { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }

  .exercise-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    margin-bottom: 8px;
  }
  .exercise-row .name { font-size: 15px; font-weight: 600; }
  .exercise-row button {
    background: transparent;
    border: none;
    color: var(--danger);
    font-size: 20px;
    cursor: pointer;
    padding: 2px 8px;
    line-height: 1;
  }

  .set-list { list-style: none; margin: 10px 0; padding: 0; }
  .set-list li {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .set-list li .num { color: var(--text-dim); }
  .set-list li .val { font-weight: 700; }

  .set-form { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .set-form .field { flex: 1; }
  .set-form input { margin-bottom: 0; }
  .set-form button { width: auto; padding: 13px 16px; }

  .link-btn { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; }

  form.inline-add { display: flex; gap: 8px; margin-top: 12px; }
  form.inline-add input { margin-bottom: 0; }
  form.inline-add button { width: auto; padding: 13px 18px; }

  /* bottom nav */
  nav.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  nav.bottom-nav button {
    flex: 1;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 0;
    border-radius: var(--radius-sm);
  }
  nav.bottom-nav button svg { width: 22px; height: 22px; }
  nav.bottom-nav button.active { color: var(--accent); background: var(--surface-2); }

  /* fixed bottom CTA (workout screen) */
  .fixed-cta {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    z-index: 20;
  }

  /* profile */
  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 800;
    margin: 8px auto 12px;
  }
  .profile-header { text-align: center; margin-bottom: 22px; }
  .profile-header .email { color: var(--text-dim); font-size: 14px; }

  .theme-row { display: flex; gap: 10px; margin-top: 8px; }
  .theme-swatch {
    flex: 1;
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
  }
  .theme-swatch.selected { border-color: var(--accent); }
  .theme-swatch .dot { width: 20px; height: 20px; border-radius: 999px; margin: 0 auto 8px; }

  h3.section-title { font-size: 15px; font-weight: 800; margin: 22px 0 10px; }

  /* header in cima alle pagine principali */
  header.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 4px;
  }
  header.app-header .logo-mark { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
  header.app-header .header-title { font-size: 17px; font-weight: 800; margin: 0; text-align: center; flex: 1; }
  header.app-header .profile-btn {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
  }
  header.app-header .profile-btn svg { width: 19px; height: 19px; }

  /* circuito a tempo */
  .circuit-progress { color: var(--text-dim); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin: 4px 0 10px; }
  .circuit-phase-tag { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; margin-bottom: 12px; }
  .circuit-phase-tag.work { background: var(--accent); color: var(--accent-ink); }
  .circuit-phase-tag.rest { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
  .circuit-exname { font-size: 26px; font-weight: 800; margin: 0 0 20px; letter-spacing: -0.02em; }
  .circuit-timer-wrap { text-align: center; margin: 10px 0 20px; }
  .circuit-timer { font-size: 96px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .circuit-bar-track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .circuit-bar-fill { height: 100%; background: var(--cta); border-radius: 999px; transition: width 1s linear; }

  /* libreria esercizi */
  select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 12px;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .pill-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .pill.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .exlib-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .exlib-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 12px;
    cursor: pointer;
    text-align: center;
  }
  .exlib-icon { font-size: 32px; display: block; margin-bottom: 8px; }
  .exlib-name { display: block; font-size: 14px; font-weight: 700; margin-bottom: 4px; line-height: 1.25; }
  .exlib-muscle { display: block; font-size: 12px; color: var(--text-dim); }
  .exlib-badge { position: absolute; top: 8px; right: 8px; font-size: 10px; padding: 3px 8px; background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }

  .exlib-detail-banner {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 30px;
    text-align: center;
    font-size: 56px;
    margin-bottom: 10px;
  }

  .muscle-list { margin-bottom: 6px; }
  .muscle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .muscle-dots { color: var(--accent); letter-spacing: 2px; }

  .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-bottom: 14px; }
  .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); font-weight: 500; cursor: pointer; margin-bottom: 0; }
  .checkbox-item input { width: auto; margin: 0; }
</style>
</head>

  var MUSCLE_GROUPS = ["Petto", "Schiena", "Spalle", "Bicipiti", "Tricipiti", "Avambracci", "Addominali", "Quadricipiti", "Femorali", "Glutei", "Polpacci", "Corpo intero"];
  var EQUIPMENT_TYPES = ["Corpo libero", "Manubri", "Bilanciere", "Kettlebell", "Macchina", "Cavi", "Elastico", "Sbarra"];
  var DIFFICULTY_LEVELS = ["Principiante", "Intermedio", "Avanzato"];
  var EQUIPMENT_ICONS = {
    "Corpo libero": "🤸",
    "Manubri": "🏋️",
    "Bilanciere": "🏋️‍♂️",
    "Kettlebell": "🔔",
    "Macchina": "⚙️",
    "Cavi": "🔗",
    "Elastico": "➰",
    "Sbarra": "🧗"
  };

  var state = {
    user: null,
    view: "loading",
    authMode: "login",
    authError: "",
    theme: "blu",
    templates: [],
    currentTemplate: null,
    currentTemplateExercises: [],
    activeSession: null,
    sessionExercises: [],
    libraryExercises: [],
    libraryFilterMuscle: null,
    libraryFilterEquipment: null,
    libraryPickMode: false,
    currentLibraryExercise: null,
    libraryForm: null,
    sessionSets: [],
    history: [],
    historyDetail: null,
    historyDetailSets: [],
    historyDetailExercises: [],
    presets: [],
    currentPreset: null,
    currentPresetExercises: [],
    circuit: null,
    stats: { count: 0, hours: 0 },
    busy: false
  };

  try {
    var savedTheme = localStorage.getItem("mydojo-theme");
    if (savedTheme && THEMES.indexOf(savedTheme) !== -1) state.theme = savedTheme;
  } catch (e) {}
  document.documentElement.setAttribute("data-theme", state.theme);

  var app = document.getElementById("app");
  var workoutTimerHandle = null;
  var circuitTimerHandle = null;
  var audioCtx = null;

  function beep(freq, durMs) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durMs / 1000);
    } catch (e) {}
  }

  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    return d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }) +
      " " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  }

  function gradientFor(id) {
    var sum = 0;
    String(id).split("").forEach(function (c) { sum += c.charCodeAt(0); });
    return GRADIENTS[sum % GRADIENTS.length];
  }

  function elapsedText(startedAt) {
    var secs = Math.max(0, Math.floor((Date.now() - new Date(startedAt).getTime()) / 1000));
    var h = Math.floor(secs / 3600);
    var m = Math.floor((secs % 3600) / 60);
    var s = secs % 60;
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    return (h > 0 ? h + ":" + pad(m) : m) + ":" + pad(s);
  }

  function stopWorkoutTimer() {
    if (workoutTimerHandle) { clearInterval(workoutTimerHandle); workoutTimerHandle = null; }
  }

  function startWorkoutTimer(startedAt) {
    stopWorkoutTimer();
    workoutTimerHandle = setInterval(function () {
      var el = document.getElementById("workout-elapsed");
      if (!el) { stopWorkoutTimer(); return; }
      el.textContent = elapsedText(startedAt);
    }, 1000);
  }

  function isCircuitSession() {
    return state.sessionExercises.length > 0 && state.sessionExercises.every(function (ex) { return ex.duration_seconds != null; });
  }

  function initCircuitIfNeeded() {
    if (isCircuitSession()) {
      if (!state.circuit) {
        state.circuit = { index: 0, phase: "work", secondsLeft: state.sessionExercises[0].duration_seconds, paused: false };
      }
    } else {
      state.circuit = null;
    }
  }

  function stopCircuitTimer() {
    if (circuitTimerHandle) { clearInterval(circuitTimerHandle); circuitTimerHandle = null; }
  }

  function startCircuitTimer() {
    stopCircuitTimer();
    circuitTimerHandle = setInterval(tickCircuit, 1000);
  }

  function updateCircuitDom() {
    var c = state.circuit;
    var secEl = document.getElementById("circuit-seconds");
    var barEl = document.getElementById("circuit-bar-fill");
    if (!c || !secEl || !barEl) return;
    var current = state.sessionExercises[c.index];
    var totalForPhase = c.phase === "rest" ? REST_SECONDS : current.duration_seconds;
    secEl.textContent = c.secondsLeft;
    var pct = Math.max(0, Math.min(100, Math.round((c.secondsLeft / totalForPhase) * 100)));
    barEl.style.width = pct + "%";
  }

  function tickCircuit() {
    if (!state.circuit || state.circuit.paused) return;
    state.circuit.secondsLeft -= 1;
    if (state.circuit.secondsLeft <= 0) {
      advanceCircuitPhase();
    } else {
      if (state.circuit.secondsLeft <= 3) beep(660, 90);
      updateCircuitDom();
    }
  }

  function advanceCircuitPhase() {
    var c = state.circuit;
    var exs = state.sessionExercises;
    if (c.phase === "work") {
      if (c.index >= exs.length - 1) {
        completeCircuit();
        return;
      }
      c.phase = "rest";
      c.secondsLeft = REST_SECONDS;
    } else {
      c.index += 1;
      c.phase = "work";
      c.secondsLeft = exs[c.index].duration_seconds;
    }
    beep(880, 180);
    vibrate(150);
    render();
  }

  function skipCircuitPhase() {
    if (!state.circuit) return;
    advanceCircuitPhase();
  }

  function toggleCircuitPause() {
    if (!state.circuit) return;
    state.circuit.paused = !state.circuit.paused;
    render();
  }

  function completeCircuit() {
    stopCircuitTimer();
    state.circuit = null;
    beep(440, 400);
    vibrate([120, 60, 120]);
    finishSession();
  }

  // ---------- render ----------

  function render() {
    if (state.view !== "workout") { stopWorkoutTimer(); stopCircuitTimer(); }

    if (state.view === "loading") {
      app.innerHTML = '<div class="empty">Caricamento...</div>';
      return;
    }
    if (!state.user) {
      app.innerHTML = renderAuth();
      return;
    }

    var knownViews = ["home", "template", "workout", "history", "historyDetail", "profile", "presets", "presetDetail", "benessere", "library", "libraryDetail", "libraryForm"];
    if (knownViews.indexOf(state.view) === -1) state.view = "home";

    var tabs = ["home", "history", "benessere"];
    var showNav = tabs.indexOf(state.view) !== -1;
    var tabTitles = { home: "Schede", history: "Storico", benessere: "Benessere" };
    var body = "";
    if (state.view === "home") body = renderHome();
    else if (state.view === "template") body = renderTemplateEditor();
    else if (state.view === "workout") body = renderWorkout();
    else if (state.view === "history") body = renderHistory();
    else if (state.view === "historyDetail") body = renderHistoryDetail();
    else if (state.view === "profile") body = renderProfile();
    else if (state.view === "presets") body = renderPresets();
    else if (state.view === "presetDetail") body = renderPresetDetail();
    else if (state.view === "benessere") body = renderBenessere();
    else if (state.view === "library") body = renderLibrary();
    else if (state.view === "libraryDetail") body = renderLibraryDetail();
    else if (state.view === "libraryForm") body = renderLibraryForm();
    else body = renderHome();

    app.innerHTML =
      (showNav ? renderScreenHeader(tabTitles[state.view]) : "") +
      '<main class="screen">' +
        (showNav && state.authError ? '<div class="error-msg">' + escapeHtml(state.authError) + '</div>' : "") +
        body +
      '</main>' +
      (showNav ? renderBottomNav() : "");

    if (state.view === "workout" && state.activeSession) {
      startWorkoutTimer(state.activeSession.started_at);
      if (isCircuitSession()) startCircuitTimer();
    }
  }

  function renderScreenHeader(title) {
    var logoSrc = state.theme === "scuro" ? LOGO_WHITE : LOGO_BLACK;
    return '<header class="app-header">' +
      '<img src="' + logoSrc + '" alt="My Dojo" class="logo-mark">' +
      '<h1 class="header-title">' + escapeHtml(title) + '</h1>' +
      '<button class="profile-btn" data-action="nav" data-view="profile">' + NAV_ICONS.profilo + '</button>' +
    '</header>';
  }

  function renderBottomNav() {
    function item(view, key, label) {
      return '<button class="' + (state.view === view ? "active" : "") + '" data-action="nav" data-view="' + view + '">' +
        NAV_ICONS[key] + '<span>' + label + '</span></button>';
    }
    return '<nav class="bottom-nav">' +
      item("home", "schede", "Schede") +
      item("history", "storico", "Storico") +
      item("benessere", "benessere", "Benessere") +
      '</nav>';
  }

  function renderAuth() {
    var isLogin = state.authMode === "login";
    var logoSrc = state.theme === "scuro" ? LOGO_WHITE : LOGO_BLACK;
    return '' +
      '<main class="screen" style="padding-top:50px;">' +
        '<img src="' + logoSrc + '" alt="My Dojo" style="display:block;width:140px;margin:0 auto 8px;">' +
        '<h1 style="text-align:center;font-size:26px;font-weight:800;letter-spacing:0.08em;margin:2px 0 4px;">MY DOJO</h1>' +
        '<p style="text-align:center;font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);margin:0 0 24px;">Esercizio &bull; Equilibrio &bull; Crescita</p>' +
        (state.authError ? '<div class="error-msg">' + escapeHtml(state.authError) + '</div>' : '') +
        '<form data-action="submit-auth">' +
          '<label>Email</label>' +
          '<input type="email" name="email" required autocomplete="email">' +

          '<input type="password" name="password" required autocomplete="' + (isLogin ? "current-password" : "new-password") + '" minlength="6">' +
          '<button class="btn btn-accent" type="submit" ' + (state.busy ? "disabled" : "") + '>' +

  function renderHome() {
    var html = '<p class="page-sub" style="margin-top:2px;">Le tue schede di allenamento</p>';

    if (state.activeSession) {
      html += '<div class="hero-card live" style="background:' + gradientFor(state.activeSession.template_id || state.activeSession.id) + ';" data-action="resume-session">' +

  function renderPresets() {
    var html = '<button class="back-btn" data-action="go-home">←</button>';
    html += '<h1 class="page-title">Schede pronte</h1><p class="page-sub">Circuiti a tempo, pronti per iniziare</p>';

      html += '<div class="empty">Nessuna scheda pronta disponibile al momento.</div>';

      state.presets.forEach(function (p) {
        html += '<div class="hero-card" style="background:' + gradientFor(p.id) + ';min-height:110px;" data-action="open-preset-detail" data-id="' + p.id + '">' +
          '<span class="hero-icon">⏱️</span>' +
          '<p class="hero-title">' + escapeHtml(p.name) + '</p>' +
          '<p class="hero-meta">' + escapeHtml(p.description || "") + '</p>' +
        '</div>';
      });

    return html;

  function renderPresetDetail() {
    var p = state.currentPreset;
    var html = '<button class="back-btn" data-action="open-presets">←</button>';
    html += '<h1 class="page-title">' + escapeHtml(p.name) + '</h1><p class="page-sub">' + escapeHtml(p.description || "") + '</p>';

    html += '<div class="stats-row">' +
      '<div class="stat-tile"><span class="num">' + state.currentPresetExercises.length + '</span><span class="lbl">Esercizi</span></div>' +
      '<div class="stat-tile"><span class="num">~' + Math.round(totalSeconds / 60) + '</span><span class="lbl">Minuti</span></div>' +
    '</div>';

    state.currentPresetExercises.forEach(function (ex, i) {
      html += '<div class="exercise-row">' +
        '<span class="name">' + (i + 1) + '. ' + escapeHtml(ex.name) + '</span>' +
        '<span class="tag" style="background:var(--surface-2);color:var(--text-dim);">' + ex.duration_seconds + 's</span>' +
      '</div>';

    html += '<button class="btn btn-accent" data-action="clone-preset" style="margin-top:20px;">Aggiungi alle mie schede</button>';

  function pillButton(label, action, value, active) {
    return '<button class="pill' + (active ? " active" : "") + '" data-action="' + action + '" data-value="' + escapeHtml(value) + '">' + escapeHtml(label) + '</button>';
  }

  function equipmentIcon(eq) {
    return EQUIPMENT_ICONS[eq] || "💪";

  function renderLibrary() {
    var html = state.libraryPickMode
      ? '<button class="back-btn" data-action="open-template" data-id="' + state.currentTemplate.id + '">←</button>'
      : '<button class="back-btn" data-action="go-home">←</button>';
    html += '<h1 class="page-title">Libreria esercizi</h1>';
    html += '<p class="page-sub">' + (state.libraryPickMode ? "Scegli un esercizio da aggiungere alla scheda" : "Come si fanno e quali muscoli coinvolgono") + '</p>';

    html += '<div class="pill-row">' +
      pillButton("Tutti i muscoli", "filter-muscle", "", !state.libraryFilterMuscle) +
      MUSCLE_GROUPS.map(function (m) { return pillButton(m, "filter-muscle", m, state.libraryFilterMuscle === m); }).join("") +
    '</div>';
    html += '<div class="pill-row">' +
      pillButton("Tutti gli attrezzi", "filter-equipment", "", !state.libraryFilterEquipment) +
      EQUIPMENT_TYPES.map(function (eq) { return pillButton(eq, "filter-equipment", eq, state.libraryFilterEquipment === eq); }).join("") +
    '</div>';

    var list = state.libraryExercises.filter(function (ex) {
      if (state.libraryFilterMuscle && ex.muscle_primary !== state.libraryFilterMuscle) return false;
      if (state.libraryFilterEquipment && ex.equipment !== state.libraryFilterEquipment) return false;
      return true;
    });

    if (list.length === 0) {
      html += '<div class="empty">Nessun esercizio trovato con questi filtri.</div>';

  function renderTemplateEditor() {
    var t = state.currentTemplate;
    var html = '<button class="back-btn" data-action="go-home">←</button>';
    html += '<h1 class="page-title">' + (t.id ? "Modifica scheda" : "Nuova scheda") + '</h1>';

      '<label>Nome scheda</label>' +
      '<input type="text" name="name" value="' + escapeHtml(t.name || "") + '" placeholder="Es. Petto/Tricipiti" required>' +
      '<button class="btn btn-accent" type="submit">' + (t.id ? "Salva nome" : "Crea scheda") + '</button>' +
    '</form>';

    if (t.id) {
      html += '<h3 class="section-title">Esercizi</h3>';
      if (state.currentTemplateExercises.length === 0) {
        html += '<p class="page-sub" style="margin:0 0 8px;">Nessun esercizio ancora aggiunto.</p>';
      } else {
        state.currentTemplateExercises.forEach(function (ex) {
          html += '<div class="exercise-row">' +
            '<span class="name">' + (ex.library_exercise_id ? "📚 " : "") + escapeHtml(ex.name) + '</span>' +
            '<button data-action="delete-exercise" data-id="' + ex.id + '">&times;</button>' +
          '</div>';
        });
      }
      html += '<button class="btn btn-ghost btn-small" data-action="open-library-pick" style="margin-top:4px;">📚 Scegli dalla libreria</button>';
      html += '<form class="inline-add" data-action="add-exercise">' +
        '<input type="text" name="exname" placeholder="Oppure scrivi un nome libero" required>' +
        '<button class="btn btn-accent" type="submit">+</button>' +
      '</form>';

      html += '<button class="btn btn-danger" data-action="delete-template" data-id="' + t.id + '" style="margin-top:24px;">Elimina scheda</button>';
    }

    return html;
  }

  function renderWorkout() {
    if (isCircuitSession()) return renderCircuitPlayer();
    return renderWorkoutFreeform();
  }

  function renderCircuitPlayer() {
    var c = state.circuit;
    var exs = state.sessionExercises;
    var current = exs[c.index];
    var isRest = c.phase === "rest";
    var nextEx = exs[c.index + 1];
    var totalForPhase = isRest ? REST_SECONDS : current.duration_seconds;
    var pct = Math.max(0, Math.min(100, Math.round((c.secondsLeft / totalForPhase) * 100)));

    var html = '<button class="back-btn" data-action="go-home">←</button>';
    html += '<p class="circuit-progress">Esercizio ' + (c.index + 1) + ' di ' + exs.length + '</p>';
    html += '<div class="circuit-phase-tag ' + (isRest ? "rest" : "work") + '">' + (isRest ? "RIPOSO" : "IN CORSO") + '</div>';
    html += '<h2 class="circuit-exname">' + escapeHtml(isRest ? (nextEx ? "Prossimo: " + nextEx.name : "Ultimo esercizio") : current.name) + '</h2>';
    html += '<div class="circuit-timer-wrap"><div class="circuit-timer" id="circuit-seconds">' + c.secondsLeft + '</div></div>';
    html += '<div class="circuit-bar-track"><div class="circuit-bar-fill" id="circuit-bar-fill" style="width:' + pct + '%;"></div></div>';

    if (!isRest && current.instructions) {
      html += '<div class="card" style="margin-top:20px;">' +
        '<p class="section-title" style="margin-top:0;margin-bottom:6px;font-size:13px;font-weight:800;">Come si fa</p>' +
        '<p style="margin:0;line-height:1.5;">' + escapeHtml(current.instructions) + '</p>' +
      '</div>';
    }

    html += '<div class="btn-row" style="margin-top:24px;">' +
      '<button class="btn btn-ghost" data-action="circuit-pause">' + (c.paused ? "▶ Riprendi" : "⏸ Pausa") + '</button>' +
      '<button class="btn btn-accent" data-action="circuit-skip">Salta ⏭</button>' +
    '</div>';

    return html;
  }

  function renderWorkoutFreeform() {
    var s = state.activeSession;
    var html = '<button class="back-btn" data-action="go-home">←</button>';
    html += '<div class="hero-card" style="background:' + gradientFor(s.template_id || s.id) + ';min-height:100px;cursor:default;">' +
      '<span class="hero-icon">🏋️</span>' +
      '<p class="hero-title">' + escapeHtml(s.template_name) + '</p>' +
      '<p class="hero-meta">In corso da <span id="workout-elapsed">' + elapsedText(s.started_at) + '</span></p>' +
    '</div>';

    if (state.sessionExercises.length === 0) {
      html += '<div class="empty">Questa scheda non ha esercizi.<br>Aggiungili prima di allenarti.</div>';
    }

    state.sessionExercises.forEach(function (ex) {
      var sets = state.sessionSets.filter(function (st) { return st.template_exercise_id === ex.id; });
      html += '<div class="card">' +
        '<p style="font-size:16px;font-weight:700;margin:0 0 4px;">' + escapeHtml(ex.name) + '</p>';

      if (sets.length > 0) {
        html += '<ul class="set-list">';
        sets.forEach(function (st) {
          html += '<li><span class="num">Serie ' + st.set_number + '</span><span class="val">' + st.reps + ' rip. × ' + st.weight + ' kg</span></li>';
        });
        html += '</ul>';
      }

      html += '<form class="set-form" data-action="add-set" data-exercise-id="' + ex.id + '" data-exercise-name="' + escapeHtml(ex.name) + '">' +
        '<div class="field"><label>Ripetizioni</label><input type="number" name="reps" min="0" required></div>' +
        '<div class="field"><label>Peso (kg)</label><input type="number" name="weight" min="0" step="0.5" required></div>' +
        '<button class="btn btn-accent" type="submit">+</button>' +
      '</form>' +
      '</div>';
    });

    html += '<div style="height:70px;"></div>';
    html += '<div class="fixed-cta"><button class="btn btn-cta" data-action="finish-session">Termina allenamento</button></div>';
    return html;
  }

  function renderHistory() {
    var html = '<p class="page-sub" style="margin-top:2px;">I tuoi allenamenti passati</p>';

    html += '<div class="stats-row">' +
      '<div class="stat-tile"><span class="num">' + state.stats.count + '</span><span class="lbl">Allenamenti</span></div>' +
      '<div class="stat-tile"><span class="num">' + state.stats.hours + '</span><span class="lbl">Ore totali</span></div>' +
    '</div>';

    if (state.history.length === 0) {
      html += '<div class="empty">Nessun allenamento registrato ancora.</div>';
    } else {
      state.history.forEach(function (s) {
        html += '<div class="card" style="cursor:pointer;display:flex;align-items:center;gap:12px;" data-action="open-history-detail" data-id="' + s.id + '">' +
          '<div style="width:44px;height:44px;border-radius:12px;flex-shrink:0;background:' + gradientFor(s.template_id || s.id) + ';"></div>' +
          '<div>' +
            '<p style="font-weight:700;margin:0 0 2px;">' + escapeHtml(s.template_name) + (s.finished_at ? "" : ' <span class="tag tag-solid" style="color:var(--cta-ink);">In corso</span>') + '</p>' +
            '<p style="color:var(--text-dim);font-size:13px;margin:0;">' + formatDate(s.started_at) + '</p>' +
          '</div>' +
        '</div>';
      });
    }
    return html;
  }

  function renderHistoryDetail() {
    var s = state.historyDetail;
    var html = '<button class="back-btn" data-action="open-history">←</button>';
    html += '<h1 class="page-title">' + escapeHtml(s.template_name) + '</h1>';
    html += '<p class="page-sub">' + formatDate(s.started_at) +
      (s.finished_at ? " — durata " + durationText(s.started_at, s.finished_at) : " — in corso") + '</p>';

    var byExercise = {};
    var order = [];
    state.historyDetailSets.forEach(function (st) {
      if (!byExercise[st.exercise_name]) { byExercise[st.exercise_name] = []; order.push(st.exercise_name); }
      byExercise[st.exercise_name].push(st);
    });

    if (order.length === 0) {
      if (state.historyDetailExercises.length > 0) {
        html += '<p class="page-sub" style="margin-top:-8px;">Esercizi di questo circuito:</p>';
        state.historyDetailExercises.forEach(function (ex) {
          html += '<div class="exercise-row"><span class="name">' + escapeHtml(ex.name) + '</span>' +
            (ex.duration_seconds ? '<span class="tag" style="background:var(--surface-2);color:var(--text-dim);">' + ex.duration_seconds + 's</span>' : '') +
          '</div>';
        });
      } else {
        html += '<div class="empty">Nessuna serie registrata in questo allenamento.</div>';
      }
    } else {
      order.forEach(function (name) {
        html += '<div class="card"><p style="font-weight:700;margin:0 0 4px;">' + escapeHtml(name) + '</p><ul class="set-list">';
        byExercise[name].forEach(function (st) {
          html += '<li><span class="num">Serie ' + st.set_number + '</span><span class="val">' + st.reps + ' rip. × ' + st.weight + ' kg</span></li>';
        });
        html += '</ul></div>';
      });
    }
    return html;
  }

  function renderBenessere() {
    return '<p class="page-sub" style="margin-top:2px;">Yoga, mindfulness, respirazione</p>' +
      '<div class="empty" style="padding-top:60px;">' +
        '<div style="font-size:48px;margin-bottom:12px;">🧘</div>' +
        '<p style="font-size:16px;font-weight:700;color:var(--text);margin:0 0 6px;">Presto disponibile</p>' +
        '<p style="max-width:280px;margin:0 auto;">Questa sezione sarà dedicata al tuo equilibrio mentale: esercizi di respirazione, meditazione guidata e stretching. Arriva in un prossimo aggiornamento.</p>' +
      '</div>';
  }

  function renderProfile() {
    var email = state.user.email || "";
    var initial = email.charAt(0).toUpperCase() || "?";
    var html = '<button class="back-btn" data-action="go-home">←</button>' +
      '<div class="profile-header">' +
      '<div class="avatar">' + escapeHtml(initial) + '</div>' +
      '<div class="email">' + escapeHtml(email) + '</div>' +
    '</div>';

    html += '<div class="stats-row">' +
      '<div class="stat-tile"><span class="num">' + state.stats.count + '</span><span class="lbl">Allenamenti</span></div>' +
      '<div class="stat-tile"><span class="num">' + state.stats.hours + '</span><span class="lbl">Ore totali</span></div>' +
      '<div class="stat-tile"><span class="num">' + state.templates.length + '</span><span class="lbl">Schede</span></div>' +
    '</div>';

    html += '<h3 class="section-title">Aspetto</h3>';
    html += '<div class="theme-row">';
    THEMES.forEach(function (th) {
      html += '<div class="theme-swatch ' + (state.theme === th ? "selected" : "") + '" data-action="set-theme" data-theme="' + th + '">' +
        '<div class="dot" style="background:' + THEME_DOT_COLOR[th] + ';"></div>' + THEME_LABELS[th] +
      '</div>';
    });
    html += '</div>';

    html += '<button class="btn btn-ghost" data-action="logout" style="margin-top:28px;">Esci</button>';
    return html;
  }

  function durationText(start, end) {
    var mins = Math.max(0, Math.round((new Date(end) - new Date(start)) / 60000));
    if (mins < 60) return mins + " min";
    return Math.floor(mins / 60) + "h " + (mins % 60) + "min";
  }

  // ---------- data loading ----------

  function loadTemplates() {
    return sb.from("workout_templates").select("*").order("created_at", { ascending: false })
      .then(function (res) {
        if (res.error) throw res.error;
        state.templates = res.data;
      });
  }

  function loadActiveSession() {
    return sb.from("workout_sessions").select("*").is("finished_at", null)
      .order("started_at", { ascending: false }).limit(1)
      .then(function (res) {
        if (res.error) throw res.error;
        state.activeSession = res.data && res.data.length ? res.data[0] : null;
      });
  }

  function loadTemplateExercises(templateId) {
    return sb.from("template_exercises").select("*").eq("template_id", templateId).order("order_index", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        state.currentTemplateExercises = res.data;
      });
  }

  function loadSessionData(sessionId, templateId) {
    var p1 = templateId
      ? sb.from("template_exercises").select("*").eq("template_id", templateId).order("order_index", { ascending: true })
      : Promise.resolve({ data: [] });
    var p2 = sb.from("session_sets").select("*").eq("session_id", sessionId).order("created_at", { ascending: true });
    return Promise.all([p1, p2]).then(function (results) {
      if (results[0].error) throw results[0].error;
      if (results[1].error) throw results[1].error;
      state.sessionExercises = results[0].data;
      state.sessionSets = results[1].data;
    });
  }

  function loadHistory() {
    return sb.from("workout_sessions").select("*").order("started_at", { ascending: false })
      .then(function (res) {
        if (res.error) throw res.error;
        state.history = res.data;
        var count = res.data.length;
        var totalMs = 0;
        res.data.forEach(function (s) {
          if (s.finished_at) totalMs += new Date(s.finished_at) - new Date(s.started_at);
        });
        state.stats = { count: count, hours: Math.round((totalMs / 3600000) * 10) / 10 };
      });
  }

  function loadHistoryDetail(sessionId, templateId) {
    return sb.from("session_sets").select("*").eq("session_id", sessionId).order("created_at", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        state.historyDetailSets = res.data;
        if (res.data.length === 0 && templateId) {
          return sb.from("template_exercises").select("*").eq("template_id", templateId).order("order_index", { ascending: true })
            .then(function (res2) {
              if (res2.error) throw res2.error;
              state.historyDetailExercises = res2.data;
            });
        }
        state.historyDetailExercises = [];
      });
  }

  function loadPresets() {
    return sb.from("preset_templates").select("*").order("name", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        state.presets = res.data;
      });
  }

  function loadPresetExercises(presetId) {
    return sb.from("preset_template_exercises").select("*").eq("preset_template_id", presetId).order("order_index", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        state.currentPresetExercises = res.data;
      });
  }

  function loadLibraryExercises() {
    return sb.from("exercises").select("*").order("name", { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        state.libraryExercises = res.data;
      });
  }

  // ---------- actions ----------

  function withBusy(fn) {
    if (state.busy) return;
    state.busy = true;
    var settled = false;
    var watchdog = setTimeout(function () {
      if (settled) return;
      settled = true;
      console.warn("[My Dojo] operazione bloccata troppo a lungo, sblocco l'app");
      state.busy = false;
      if (state.view === "loading") state.view = "auth";
      state.authError = "L'operazione sta impiegando troppo tempo. Controlla la connessione e riprova.";
      render();
    }, 15000);
    return Promise.resolve().then(fn).catch(function (err) {
      state.authError = (err && err.message) || String(err);
    }).then(function () {
      if (settled) return;
      settled = true;
      clearTimeout(watchdog);
      state.busy = false;
      render();
    });
  }

  function loadHomeData() {
    state.authError = "";
    return Promise.all([loadTemplates(), loadActiveSession(), loadHistory()]).then(function () {
      state.view = "home";
    });
  }

  function goHome() {
    withBusy(loadHomeData);
  }

  function handleSubmitAuth(form) {
    var email = form.email.value.trim();
    var password = form.password.value;
    withBusy(function () {
      state.authError = "";
      var call = state.authMode === "login"
        ? sb.auth.signInWithPassword({ email: email, password: password })
        : sb.auth.signUp({ email: email, password: password, options: { emailRedirectTo: window.location.origin + window.location.pathname } });
      return call.then(function (res) {
        if (res.error) { state.authError = res.error.message; return; }
        if (state.authMode === "signup" && res.data && res.data.user && !res.data.session) {
          state.authError = "Controlla la tua email per confermare l'account (il messaggio arriva da Supabase, il servizio che gestisce gli account di questa app — non è spam), poi accedi.";
          state.authMode = "login";
          return;
        }
        if (res.data && res.data.session) {
          console.log("[My Dojo] login riuscito, carico i dati direttamente");
          booted = true;
          state.user = res.data.user;
          return loadHomeData();
        }
      });
    });
  }

  function handleLogout() {
    withBusy(function () {
      return sb.auth.signOut();
    });
  }

  function openTemplate(id) {
    withBusy(function () {
      state.authError = "";
      var t = state.templates.filter(function (x) { return x.id === id; })[0];
      state.currentTemplate = t;
      state.view = "template";
      return loadTemplateExercises(id);
    });
  }

  function newTemplate() {
    state.authError = "";
    state.currentTemplate = { id: null, name: "" };
    state.currentTemplateExercises = [];
    state.view = "template";
    render();
  }

  function saveTemplateName(name) {
    withBusy(function () {
      state.authError = "";
      if (state.currentTemplate.id) {
        return sb.from("workout_templates").update({ name: name }).eq("id", state.currentTemplate.id)
          .then(function (res) {
            if (res.error) throw res.error;
            state.currentTemplate.name = name;
          });
      }
      return sb.from("workout_templates").insert({ user_id: state.user.id, name: name }).select().single()
        .then(function (res) {
          if (res.error) throw res.error;
          state.currentTemplate = res.data;
          return loadTemplateExercises(res.data.id);
        }).then(loadTemplates);
    });
  }

  function addExercise(name) {
    withBusy(function () {
      state.authError = "";
      var orderIndex = state.currentTemplateExercises.length;
      return sb.from("template_exercises").insert({
        user_id: state.user.id,
        template_id: state.currentTemplate.id,
        name: name,
        order_index: orderIndex
      }).then(function (res) {
        if (res.error) throw res.error;
        return loadTemplateExercises(state.currentTemplate.id);
      });
    });
  }

  function deleteExercise(id) {
    withBusy(function () {
      state.authError = "";
      return sb.from("template_exercises").delete().eq("id", id).then(function (res) {
        if (res.error) throw res.error;
        return loadTemplateExercises(state.currentTemplate.id);
      });
    });
  }

  function deleteTemplate(id) {
    if (!confirm("Eliminare questa scheda e tutti i suoi esercizi?")) return;
    withBusy(function () {
      state.authError = "";
      return sb.from("workout_templates").delete().eq("id", id).then(function (res) {
        if (res.error) throw res.error;
        state.view = "home";
        return loadTemplates();
      });
    });
  }

  function startSession(templateId) {
    withBusy(function () {
      state.authError = "";
      var t = state.templates.filter(function (x) { return x.id === templateId; })[0];
      return sb.from("workout_sessions").insert({
        user_id: state.user.id,
        template_id: templateId,
        template_name: t.name
      }).select().single().then(function (res) {
        if (res.error) throw res.error;
        state.activeSession = res.data;
        return loadSessionData(res.data.id, templateId);
      }).then(function () {
        initCircuitIfNeeded();
        state.view = "workout";
      });
    });
  }

  function resumeSession() {
    withBusy(function () {
      state.authError = "";
      return loadSessionData(state.activeSession.id, state.activeSession.template_id).then(function () {
        initCircuitIfNeeded();
        state.view = "workout";
      });
    });
  }

  function addSet(exerciseId, exerciseName, reps, weight) {
    withBusy(function () {
      state.authError = "";
      var existing = state.sessionSets.filter(function (st) { return st.template_exercise_id === exerciseId; });
      var setNumber = existing.length + 1;
      return sb.from("session_sets").insert({
        user_id: state.user.id,
        session_id: state.activeSession.id,
        template_exercise_id: exerciseId,
        exercise_name: exerciseName,
        set_number: setNumber,
        reps: reps,
        weight: weight
      }).then(function (res) {
        if (res.error) throw res.error;
        return loadSessionData(state.activeSession.id, state.activeSession.template_id);
      });
    });
  }

  function finishSession() {
    withBusy(function () {
      state.authError = "";
      return sb.from("workout_sessions").update({ finished_at: new Date().toISOString() }).eq("id", state.activeSession.id)
        .then(function (res) {
          if (res.error) throw res.error;
          state.activeSession = null;
          return Promise.all([loadTemplates(), loadHistory()]);
        }).then(function () {
          state.view = "home";
        });
    });
  }

  function openHistory() {
    withBusy(function () {
      state.authError = "";
      return loadHistory().then(function () { state.view = "history"; });
    });
  }

  function openHistoryDetail(id) {
    withBusy(function () {
      state.authError = "";
      var s = state.history.filter(function (x) { return x.id === id; })[0];
      state.historyDetail = s;
      state.view = "historyDetail";
      return loadHistoryDetail(id, s.template_id);
    });
  }

  function openProfile() {
    withBusy(function () {
      state.authError = "";
      return loadHistory().then(function () { state.view = "profile"; });
    });
  }

  function openBenessere() {
    state.authError = "";
    state.view = "benessere";
    render();
  }

  function openPresets() {
    withBusy(function () {
      state.authError = "";
      return loadPresets().then(function () { state.view = "presets"; });
    });
  }

  function openPresetDetail(id) {
    withBusy(function () {
      state.authError = "";
      var p = state.presets.filter(function (x) { return x.id === id; })[0];
      state.currentPreset = p;
      state.view = "presetDetail";
      return loadPresetExercises(id);
    });
  }

  function clonePreset() {
    withBusy(function () {
      state.authError = "";
      var preset = state.currentPreset;
      return sb.from("workout_templates").insert({ user_id: state.user.id, name: preset.name }).select().single()
        .then(function (res) {
          if (res.error) throw res.error;
          var rows = state.currentPresetExercises.map(function (ex, i) {
            return {
              user_id: state.user.id,
              template_id: res.data.id,
              name: ex.name,
              instructions: ex.instructions,
              duration_seconds: ex.duration_seconds,
              order_index: i
            };
          });
          return sb.from("template_exercises").insert(rows);
        }).then(function (res) {
          if (res && res.error) throw res.error;
          return loadTemplates();
        }).then(function () {
          state.view = "home";
        });
    });
  }

  function openLibrary(pickMode) {
    withBusy(function () {
      state.authError = "";
      state.libraryPickMode = !!pickMode;
      state.libraryFilterMuscle = null;
      state.libraryFilterEquipment = null;
      state.view = "library";
      return loadLibraryExercises();
    });
  }

  function openLibraryDetail(id) {
    var ex = state.libraryExercises.filter(function (x) { return x.id === id; })[0];
    if (!ex) return;
    state.authError = "";
    state.currentLibraryExercise = ex;
    state.view = "libraryDetail";
    render();
  }

  function newLibraryExercise() {
    state.authError = "";
    state.libraryForm = { id: null, name: "", muscle_primary: MUSCLE_GROUPS[0], muscles_secondary: [], equipment: EQUIPMENT_TYPES[0], difficulty: "", instructions: "" };
    state.view = "libraryForm";
    render();
  }

  function editLibraryExercise(id) {
    var ex = state.libraryExercises.filter(function (x) { return x.id === id; })[0];
    if (!ex) return;
    state.authError = "";
    state.libraryForm = {
      id: ex.id,
      name: ex.name,
      muscle_primary: ex.muscle_primary,
      muscles_secondary: ex.muscles_secondary || [],
      equipment: ex.equipment,
      difficulty: ex.difficulty || "",
      instructions: ex.instructions || ""
    };
    state.view = "libraryForm";
    render();
  }

  function saveLibraryExercise(form) {
    withBusy(function () {
      state.authError = "";
      var secondary = Array.prototype.slice.call(form.querySelectorAll('input[name="muscles_secondary"]:checked')).map(function (el) { return el.value; });
      var payload = {
        name: form.name.value.trim(),
        muscle_primary: form.muscle_primary.value,
        muscles_secondary: secondary,
        equipment: form.equipment.value,
        difficulty: form.difficulty.value || null,
        instructions: form.instructions.value.trim() || null
      };
      var f = state.libraryForm;
      var call;
      if (f.id) {
        call = sb.from("exercises").update(payload).eq("id", f.id).select().single();
      } else {
        payload.user_id = state.user.id;
        call = sb.from("exercises").insert(payload).select().single();
      }
      return call.then(function (res) {
        if (res.error) throw res.error;
        return loadLibraryExercises().then(function () {
          state.currentLibraryExercise = res.data;
          state.view = "libraryDetail";
        });
      });
    });
  }

  function deleteLibraryExercise(id) {
    if (!confirm("Eliminare questo esercizio dalla tua libreria?")) return;
    withBusy(function () {
      state.authError = "";
      return sb.from("exercises").delete().eq("id", id).then(function (res) {
        if (res.error) throw res.error;
        return loadLibraryExercises().then(function () {
          state.view = "library";
        });
      });
    });
  }

  function pickLibraryExercise(id) {
    withBusy(function () {
      state.authError = "";
      var ex = state.libraryExercises.filter(function (x) { return x.id === id; })[0];
      if (!ex) return;
      var orderIndex = state.currentTemplateExercises.length;
      return sb.from("template_exercises").insert({
        user_id: state.user.id,
        template_id: state.currentTemplate.id,
        name: ex.name,
        library_exercise_id: ex.id,
        order_index: orderIndex
      }).then(function (res) {
        if (res.error) throw res.error;
        return loadTemplateExercises(state.currentTemplate.id);
      }).then(function () {
        state.libraryPickMode = false;
        state.view = "template";
      });
    });
  }

  function setTheme(theme) {
    if (THEMES.indexOf(theme) === -1) return;
    state.theme = theme;
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("mydojo-theme", theme); } catch (e) {}
    render();
  }

  // ---------- event delegation ----------

  app.addEventListener("submit", function (e) {
    var form = e.target.closest("form[data-action]");
    if (!form) return;
    e.preventDefault();
    var action = form.getAttribute("data-action");
    if (action === "submit-auth") handleSubmitAuth(form);
    else if (action === "save-template-name") saveTemplateName(form.name.value.trim());
    else if (action === "add-exercise") {
      var name = form.exname.value.trim();
      if (name) { addExercise(name); form.reset(); }
    } else if (action === "add-set") {
      var exId = form.getAttribute("data-exercise-id");
      var exName = form.getAttribute("data-exercise-name");
      var reps = parseInt(form.reps.value, 10);
      var weight = parseFloat(form.weight.value);
      if (!isNaN(reps) && !isNaN(weight)) addSet(exId, exName, reps, weight);
    } else if (action === "save-library-exercise") saveLibraryExercise(form);
  });

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el || el.tagName === "FORM") return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    if (action === "logout") handleLogout();
    else if (action === "toggle-auth-mode") {
      state.authMode = state.authMode === "login" ? "signup" : "login";
      state.authError = "";
      render();
    }
    else if (action === "nav") {
      var view = el.getAttribute("data-view");
      if (view === "home") goHome();
      else if (view === "history") openHistory();
      else if (view === "profile") openProfile();
      else if (view === "benessere") openBenessere();
    }
    else if (action === "go-home") goHome();
    else if (action === "new-template") newTemplate();
    else if (action === "open-template") openTemplate(id);
    else if (action === "delete-exercise") deleteExercise(id);
    else if (action === "delete-template") deleteTemplate(id);
    else if (action === "start-session") startSession(id);
    else if (action === "resume-session") resumeSession();
    else if (action === "finish-session") finishSession();
    else if (action === "open-history") openHistory();
    else if (action === "open-history-detail") openHistoryDetail(id);
    else if (action === "set-theme") setTheme(el.getAttribute("data-theme"));
    else if (action === "open-presets") openPresets();
    else if (action === "open-preset-detail") openPresetDetail(id);
    else if (action === "clone-preset") clonePreset();
    else if (action === "circuit-pause") toggleCircuitPause();
    else if (action === "circuit-skip") skipCircuitPhase();
    else if (action === "open-library") openLibrary(false);
    else if (action === "open-library-pick") openLibrary(true);
    else if (action === "back-to-library") { state.view = "library"; render(); }
    else if (action === "open-library-detail") openLibraryDetail(id);
    else if (action === "pick-library-exercise") pickLibraryExercise(id);
    else if (action === "new-library-exercise") newLibraryExercise();
    else if (action === "edit-library-exercise") editLibraryExercise(id);
    else if (action === "delete-library-exercise") deleteLibraryExercise(id);
    else if (action === "filter-muscle") { state.libraryFilterMuscle = el.getAttribute("data-value") || null; render(); }
    else if (action === "filter-equipment") { state.libraryFilterEquipment = el.getAttribute("data-value") || null; render(); }
  });

  // ---------- boot ----------

  var booted = false;

  function handleAuthResolved(source, user) {
    console.log("[My Dojo] auth risolto da:", source, user ? "loggato" : "non loggato");
    if (!booted) {
      booted = true;
      state.user = user;
      if (user) goHome();
      else { state.view = "auth"; render(); }
    } else {
      state.user = user;
      if (!user) { state.view = "auth"; render(); }
      else if (state.view === "auth" || state.view === "loading") { goHome(); }
    }
  }

  sb.auth.onAuthStateChange(function (event, session) {
    handleAuthResolved("onAuthStateChange:" + event, session ? session.user : null);
  });

  sb.auth.getSession().then(function (res) {
    if (booted) return;
    handleAuthResolved("getSession", res.data.session ? res.data.session.user : null);
  }).catch(function (err) {
    console.warn("[My Dojo] getSession fallita:", err);
  });

  // rete di sicurezza finale: se dopo alcuni secondi non è successo nulla,
  // mostra la schermata di accesso invece di restare bloccati per sempre
  setTimeout(function () {
    if (booted) return;
    console.warn("[My Dojo] boot bloccato, mostro comunque la schermata di accesso");
    booted = true;
    state.view = "auth";
    state.authError = "Non sono riuscito a verificare l'accesso. Prova a entrare di nuovo.";
    render();
  }, 6000);
})();
</script>
</body>
</html>
